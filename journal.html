<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tracey's journey</title>
  <!-- Added to a home screen, this becomes the icon and the label.
       Without them iOS uses a screenshot of the page and the full title. -->
  <link rel="apple-touch-icon" href="/icon-180.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="apple-mobile-web-app-title" content="For Tracey" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#F7F5F0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Deliberately kept out of search results. The page is only reachable
     with the link and only readable once approved, but there is no
     reason for it to be indexed at all. -->
<meta name="robots" content="noindex, nofollow" />
<style>
  :root{
    --bg:#F7F5F0; --card-bg:#FFF; --text:#2B2321; --text-muted:#6E6558; --border:#E4DFD3;
    --sage:#6B7F5E; --teal:#3D5A5B; --clay:#A85C32; --rose:#B5696A; --grey:#8A8578;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;
       -webkit-font-smoothing:antialiased}
  .app{max-width:640px;margin:0 auto;padding:26px 18px 64px}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:1.85rem;margin:0 0 6px;letter-spacing:-.01em}
  .sub{margin:0 0 26px;color:var(--text-muted);font-size:.93rem;line-height:1.5;max-width:46ch}
  .back{flex:0 0 auto;font-size:.78rem;font-weight:600;border:1px solid var(--border);
    background:var(--card-bg);color:var(--text-muted);border-radius:100px;padding:6px 13px;
    cursor:pointer;font-family:inherit;text-decoration:none;display:inline-block}
  .status{color:var(--text-muted);font-size:.9rem;padding:22px 0;line-height:1.55}
  .gate{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:20px}
  .gate h2{font-family:'Fraunces',serif;font-size:1.15rem;font-weight:500;margin:0 0 8px}
  .gate p{color:var(--text-muted);font-size:.9rem;line-height:1.55;margin:0 0 14px}
  .btn{font-family:inherit;font-size:.84rem;font-weight:600;border:none;border-radius:7px;
    padding:9px 15px;cursor:pointer;background:var(--text);color:#fff;text-decoration:none;
    display:inline-block}
  .post{border-top:1px solid var(--border);padding:26px 0 6px}
  .post:first-of-type{border-top:none;padding-top:4px}
  .post h2{font-family:'Fraunces',serif;font-weight:600;font-size:1.35rem;
    margin:0 0 4px;letter-spacing:-.01em;line-height:1.3}
  .when{color:var(--text-muted);font-size:.79rem;margin:0 0 14px}
  .body{font-size:1rem;line-height:1.68}
  .body p{margin:0 0 15px}
  .body h1,.body h2,.body h3{font-family:'Fraunces',serif;font-weight:600;
    line-height:1.3;margin:24px 0 9px}
  .body h1{font-size:1.2rem} .body h2{font-size:1.1rem} .body h3{font-size:1rem}
  .body ul,.body ol{margin:0 0 15px;padding-left:22px}
  .body li{margin-bottom:6px}
  .body blockquote{margin:0 0 15px;padding:2px 0 2px 15px;border-left:3px solid var(--border);
    color:var(--text-muted);font-style:italic}
  .body hr{border:none;border-top:1px solid var(--border);margin:24px 0}
  .body code{background:var(--card-bg);border:1px solid var(--border);border-radius:4px;
    padding:1px 5px;font-size:.9em}
  .body a{color:var(--teal)}
  /* A table on a phone is mostly a scrolling problem. This one scrolls
     inside its own box rather than pushing the whole page sideways. */
  .body .tablewrap{overflow-x:auto;margin:0 0 16px;-webkit-overflow-scrolling:touch}
  .body table{border-collapse:collapse;font-size:.88rem;width:100%}
  /* Cells wrap. An earlier version kept them on one line, which is fine
     for a date and hopeless for a paragraph — one long cell made the
     whole table scroll sideways for hundreds of words. */
  .body th,.body td{border:1px solid var(--border);padding:8px 10px;
    text-align:left;vertical-align:top;line-height:1.45;
    min-width:4.5em;overflow-wrap:break-word}
  /* A narrow screen cannot show four columns of prose. Below this the
     table keeps its shape and scrolls, rather than crushing every
     column into two words wide. */
  @media (max-width: 560px) {
    .body table{min-width:520px}
  }
  .body th{background:#F2EFE8;font-weight:600}
  .body tbody tr:nth-child(even){background:#FBFAF7}
  .body pre{background:#F2EFE8;border:1px solid var(--border);border-radius:8px;
    padding:12px 14px;overflow-x:auto;margin:0 0 16px;font-size:.85rem;
    line-height:1.5;-webkit-overflow-scrolling:touch}
  .body pre code{background:none;border:none;padding:0;font-size:inherit}
  .body del{color:var(--text-muted)}
  .body ul ul,.body ol ol,.body ul ol,.body ol ul{margin:6px 0 0}
  .body .task{list-style:none;margin-left:-20px}
  .body .task .box{display:inline-block;width:1.05em;margin-right:.4em;
    color:var(--sage);font-weight:700}
  .body strong{font-weight:600}
</style>
</head>
<body>
<div class="app" id="root">
  <div class="topbar">
    <div><h1>Tracey&rsquo;s journey</h1></div>
    <a class="back" href="/">Back</a>
  </div>
  <p class="sub" id="sub"></p>
  <div id="content" class="status">Loading&hellip;</div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function () {
  var cfg = window.TRACEY_CONFIG || {};
  var content = document.getElementById('content');
  var sub = document.getElementById('sub');

  if (!cfg.SUPABASE_URL || cfg.SUPABASE_URL.indexOf('YOUR-PROJECT') !== -1) {
    content.textContent = 'config.js still has placeholder values.';
    return;
  }
  var db = supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
  var APPROVER = (cfg.APPROVER || 'the coordinator');

  function lsGet(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } }
  var me = lsGet('tracey_me');

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function fmtWhen(iso){
    try {
      return new Date(iso).toLocaleDateString(undefined,
        { weekday:'long', month:'long', day:'numeric' });
    } catch(e){ return ''; }
  }

  // ---------- a small markdown renderer ----------
  //
  // Deliberately not a library. This covers what a document exported to
  // markdown actually contains: headings, paragraphs, lists, quotes,
  // emphasis, links, rules. Anything unusual renders as plain text
  // rather than breaking, which is the right failure for someone's
  // personal writing.
  //
  // Everything is escaped before any markup is added, so nothing in the
  // text can inject HTML.
  function inline(t) {
    // A backslash before a marker means she wanted the character, not
    // the formatting. Those are set aside first — stripping them at the
    // end would be too late, the emphasis rules having already run.
    var held = [];
    var prepared = esc(t).replace(/\\([*_~`#\[\]\\])/g, function (_, ch) {
      held.push(ch);
      return '\u0000' + (held.length - 1) + '\u0000';
    });

    return prepared
      .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '')          // images: drop
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function(_, label, href) {
        return /^https?:\/\//i.test(href)
          ? '<a href="' + href + '" rel="noopener">' + label + '</a>'
          : label;
      })
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/~~([^~]+)~~/g, '<del>$1</del>')
      // Three markers first, or the two-marker rule eats part of it.
      .replace(/\*\*\*([^*]+)\*\*\*/g, '<strong><em>$1</em></strong>')
      .replace(/___([^_]+)___/g, '<strong><em>$1</em></strong>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/__([^_]+)__/g, '<strong>$1</strong>')
      .replace(/(^|\W)_([^_]+)_(?=\W|$)/g, '$1<em>$2</em>')
      .replace(/(^|[^*])\*([^*]+)\*(?!\*)/g, '$1<em>$2</em>')
      .replace(/\u0000(\d+)\u0000/g, function (_, n) { return held[+n]; });
  }

  function markdown(src) {
    var lines = String(src || '').replace(/\r\n/g, '\n').split('\n');
    var out = [], para = [], list = null;

    function flushPara() {
      if (para.length) {
        // Two spaces at the end of a line, or a trailing backslash, mean
        // she wanted the break kept.
        out.push('<p>' + para.map(function(p, n){
          return inline(p.text) + (p.brk && n < para.length - 1 ? '<br>' : '');
        }).join(' ') + '</p>');
        para = [];
      }
    }
    function flushList() {
      if (!list) return;
      // Close from the deepest level outwards, folding each into the
      // item above it.
      while (list.levels.length > 1) {
        var closed = list.levels.pop();
        var parent = list.levels[list.levels.length - 1];
        var nested = '<' + closed.tag + '>' + closed.items.join('')
          + '</' + closed.tag + '>';
        if (parent.items.length) {
          parent.items[parent.items.length - 1] =
            parent.items[parent.items.length - 1]
              .replace(/<\/li>$/, nested + '</li>');
        } else {
          parent.items.push('<li>' + nested + '</li>');
        }
      }
      var root = list.levels[0];
      out.push('<' + root.tag + '>' + root.items.join('') + '</' + root.tag + '>');
      list = null;
    }
    function flushAll() { flushPara(); flushList(); }

    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      var t = line.trim();

      if (!t) { flushAll(); continue; }

      // A fenced code block. Everything inside is left exactly as
      // written — no markdown, no smart anything.
      var fence = t.match(/^(```|~~~)(.*)$/);
      if (fence) {
        flushAll();
        var body = [];
        var k = i + 1;
        while (k < lines.length && lines[k].trim().indexOf(fence[1]) !== 0) {
          body.push(lines[k]);
          k++;
        }
        out.push('<pre><code>' + esc(body.join('\n')) + '</code></pre>');
        i = k;
        continue;
      }

      // Setext headings: a line underlined with === or ---. The dash
      // form is checked after the rule test below would have caught a
      // bare --- with nothing above it.
      if (para.length === 0 && i + 1 < lines.length
          && /^(=+|-+)\s*$/.test(lines[i + 1]) && t !== '') {
        flushAll();
        var lvl2 = lines[i + 1].trim()[0] === '=' ? 1 : 2;
        out.push('<h' + lvl2 + '>' + inline(t) + '</h' + lvl2 + '>');
        i++;
        continue;
      }

      var h = t.match(/^(#{1,6})\s+(.*)$/);
      if (h) {
        flushAll();
        var lvl = Math.min(h[1].length, 3);
        out.push('<h' + lvl + '>' + inline(h[2].replace(/\s*#+\s*$/, '')) + '</h' + lvl + '>');
        continue;
      }

      if (/^(-{3,}|\*{3,}|_{3,})$/.test(t)) { flushAll(); out.push('<hr>'); continue; }

      var q = t.match(/^>\s?(.*)$/);
      if (q) { flushAll(); out.push('<blockquote>' + inline(q[1]) + '</blockquote>'); continue; }

      // A table: a row of pipes, then a row of dashes, then the body.
      // Checked before lists, because a separator row like |---|---|
      // would otherwise be read as a bullet.
      if (t.indexOf('|') !== -1 && i + 1 < lines.length
          && /^\s*\|?[\s:-]*-[\s:|-]*\|?\s*$/.test(lines[i + 1])
          && lines[i + 1].indexOf('-') !== -1) {
        flushAll();

        function cells(row) {
          return row.trim().replace(/^\||\|$/g, '').split('|')
                    .map(function(c){ return c.trim(); });
        }

        var head = cells(t);
        var aligns = cells(lines[i + 1]).map(function(c){
          if (/^:.*:$/.test(c)) return 'center';
          if (/:$/.test(c)) return 'right';
          return 'left';
        });

        var rows = [];
        var j = i + 2;
        while (j < lines.length && lines[j].indexOf('|') !== -1
               && lines[j].trim() !== '') {
          rows.push(cells(lines[j]));
          j++;
        }

        function cell(tag, text, k) {
          var a = aligns[k] || 'left';
          return '<' + tag + (a !== 'left' ? ' style="text-align:' + a + '"' : '')
            + '>' + inline(text) + '</' + tag + '>';
        }

        var html = '<div class="tablewrap"><table><thead><tr>'
          + head.map(function(c, k){ return cell('th', c, k); }).join('')
          + '</tr></thead><tbody>'
          + rows.map(function(r){
              return '<tr>' + head.map(function(_, k){
                return cell('td', r[k] === undefined ? '' : r[k], k);
              }).join('') + '</tr>';
            }).join('')
          + '</tbody></table></div>';

        out.push(html);
        i = j - 1;
        continue;
      }

      // Lists, including indented ones. The indent of the original line
      // is what decides nesting, so this looks at `line` rather than the
      // trimmed `t`.
      var ul = t.match(/^[-*+]\s+(.*)$/);
      var ol = t.match(/^\d+[.)]\s+(.*)$/);
      if (ul || ol) {
        flushPara();
        var tag = ul ? 'ul' : 'ol';
        var indent = (line.match(/^[ \t]*/)[0] || '')
          .replace(/\t/g, '    ').length;
        var depth = Math.min(Math.floor(indent / 2), 4);
        var body = (ul || ol)[1];

        // A task list: "- [ ] water the plants". Shown with a mark
        // rather than a live checkbox, because nothing here can record
        // someone ticking it.
        var task = body.match(/^\[( |x|X)\]\s+(.*)$/);
        var li = task
          ? '<li class="task"><span class="box">'
            + (task[1].toLowerCase() === 'x' ? '\u2713' : '\u2610')
            + '</span>' + inline(task[2]) + '</li>'
          : '<li>' + inline(body) + '</li>';

        if (!list) {
          list = { levels: [{ tag: tag, depth: depth, items: [] }] };
        }

        var top = list.levels[list.levels.length - 1];

        if (depth > top.depth) {
          list.levels.push({ tag: tag, depth: depth, items: [] });
        } else {
          // Close any levels deeper than this line and fold them into
          // the item above.
          while (list.levels.length > 1 && depth < top.depth) {
            var closed = list.levels.pop();
            var parent = list.levels[list.levels.length - 1];
            var nested = '<' + closed.tag + '>' + closed.items.join('')
              + '</' + closed.tag + '>';
            if (parent.items.length) {
              parent.items[parent.items.length - 1] =
                parent.items[parent.items.length - 1]
                  .replace(/<\/li>$/, nested + '</li>');
            } else {
              parent.items.push('<li>' + nested + '</li>');
            }
            top = parent;
          }
          if (top.tag !== tag && depth === top.depth && !top.items.length) {
            top.tag = tag;
          }
        }

        list.levels[list.levels.length - 1].items.push(li);
        continue;
      }

      flushList();
      para.push({ text: t, brk: /(  |\\)$/.test(line) });
    }
    flushAll();
    return out.join('\n');
  }

  // ---------- render ----------
  function notSignedIn() {
    sub.textContent = '';
    content.className = '';
    content.innerHTML = '<div class="gate"><h2>Sign in on the main page first</h2>'
      + '<p>Open the signup page and add your name and email. Once you are approved, '
      + 'her updates appear here.</p>'
      + '<a class="btn" href="/">Go to the signup page</a></div>';
  }

  function notApproved(requested) {
    sub.textContent = '';
    content.className = '';
    content.innerHTML = '<div class="gate"><h2>Not yet</h2>'
      + '<p>' + (requested
          ? 'Your request is with ' + esc(APPROVER) + '. Once it is approved, her updates appear here.'
          : 'Reading Tracey\u2019s updates needs approval first. You can ask from the signup page.')
      + '</p><a class="btn" href="/">Back to the signup page</a></div>';
  }

  function showPosts(posts) {
    content.className = '';
    if (!posts.length) {
      sub.textContent = '';
      content.innerHTML = '<div class="status">Nothing here yet. '
        + 'When Tracey writes something, it will appear on this page.</div>';
      return;
    }
    sub.textContent = 'Her own words, newest first. '
      + 'Please keep what she writes here between you and her.';
    content.innerHTML = posts.map(function (p) {
      return '<div class="post">'
        + '<h2>' + esc(p.title) + '</h2>'
        + '<p class="when">' + fmtWhen(p.published) + '</p>'
        + '<div class="body">' + markdown(p.body) + '</div>'
        + '</div>';
    }).join('');
  }

  async function load() {
    if (!me || !me.email) { notSignedIn(); return; }

    var acc = null;
    try {
      var ar = await db.rpc('my_access', { p_email: me.email });
      if (!ar.error) acc = ar.data;
    } catch (e) {}

    var level = acc ? acc.access : 'none';
    if (level !== 'approved' && level !== 'close') {
      notApproved(acc && acc.requested);
      return;
    }

    var r = await db.rpc('list_posts', { p_email: me.email });

    // Opening the page is reading it, as far as the badge is concerned —
    // but give it a moment, so a stray tap and a bounce straight back
    // does not silently clear the count.
    setTimeout(function () {
      try { db.rpc('mark_seen', { p_email: me.email, p_what: 'journal' }); } catch (e) {}
    }, 5000);
    if (r.error) {
      content.className = 'status';
      content.textContent = 'Could not load her updates just now. Please try again shortly.';
      return;
    }
    showPosts(r.data || []);
  }

  // Reopened from a home screen icon, iOS may show this page exactly as
  // it was left rather than loading it again. Fetch afresh when it comes
  // back after a while.
  var lastLoaded = 0;
  function refreshIfStale() {
    if (document.visibilityState !== 'visible') return;
    if (Date.now() - lastLoaded < 45000) return;
    lastLoaded = Date.now();
    load();
  }
  // Between them these cover every way a page comes back:
  //   visibilitychange  app switcher, tab switch, screen unlock (iOS + Android)
  //   pageshow          restored from cache rather than loaded
  //   focus             window refocused on a laptop
  //   resume            older Android webviews
  document.addEventListener('visibilitychange', refreshIfStale);
  window.addEventListener('pageshow', function (e) {
    if (e.persisted) { lastLoaded = 0; refreshIfStale(); }
  });
  window.addEventListener('focus', refreshIfStale);
  document.addEventListener('resume', refreshIfStale);
  // A tab left open and watched fires none of the events above.
  setInterval(function () {
    if (document.visibilityState === 'visible') refreshIfStale();
  }, 180000);

  lastLoaded = Date.now();
  load();

  // ---------- staying current ----------
  //
  // A page open since before a deploy keeps running old code, and no
  // deploy can reach into it. So it asks about itself: a HEAD request
  // to its own address returns an ETag that changes whenever this file
  // changes. Different from the one it started with means the page in
  // front of you is out of date.
  //
  // Asking about this page rather than about the deploy is the right
  // question: a change to a function elsewhere does not require the
  // person reading this to have anything reloaded.
  var myTag = null;
  var needsReload = false;

  async function checkBuild() {
    try {
      var res = await fetch(window.location.pathname, {
        method: 'HEAD', cache: 'no-store'
      });
      if (!res.ok) return;
      var tag = res.headers.get('etag') || res.headers.get('last-modified');
      if (!tag) return;                    // nothing to compare: never fires

      if (myTag === null) { myTag = tag; return; }
      if (tag !== myTag) needsReload = true;
    } catch (e) { /* offline: try again later */ }
  }

  function reloadIfDue() {
    if (!needsReload) return;
    if (document.visibilityState !== 'visible') return;
    // Never while a question is on screen or something is being typed.
    if (document.querySelector('.ask-bg')) return;
    var el = document.activeElement;
    if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA')) return;
    window.location.reload();
  }

  checkBuild();
  setInterval(function () {
    if (document.visibilityState !== 'visible') return;
    checkBuild().then(reloadIfDue);
  }, 180000);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') checkBuild().then(reloadIfDue);
  });

})();
</script>
</body>
</html>
