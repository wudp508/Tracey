<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>For Tracey</title>
<meta name="description" content="Pick anything you can take. Everyone sees the same list, so nothing gets doubled up." />

<!-- Link preview. iMessage, WhatsApp, Slack and Facebook read these; the
     absolute URL on og:image matters, relative paths are ignored by most
     of them.

     og:url is deliberately absent. Some scrapers treat it as canonical
     and cache the preview against it, which would defeat adding ?v=2 to
     the link to force a fresh card. Without it, each distinct URL gets
     its own preview. -->
<meta property="og:type" content="website" />
<meta property="og:title" content="For Tracey" />
<meta property="og:description" content="Rides, walks, Izzy, errands — take whatever fits your week. Everyone sees the same list, so nothing gets doubled up." />
<meta property="og:image" content="https://tracey-humphreys-help-her-recover.netlify.app/preview.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:site_name" content="For Tracey" />

<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="For Tracey" />
<meta name="twitter:description" content="Rides, walks, Izzy, errands — take whatever fits your week." />
<meta name="twitter:image" content="https://tracey-humphreys-help-her-recover.netlify.app/preview.png" />

<meta name="theme-color" content="#F7F5F0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F5F0; --card-bg:#FFF; --text:#2B2321; --text-muted:#6E6558; --border:#E4DFD3;
    --sage:#6B7F5E; --teal:#3D5A5B; --ochre:#B8863B; --rose:#B5696A; --gold:#C9A227;
    --clay:#A85C32; --slate:#5B7C99; --plum:#7A5C7E; --grey:#8A8578;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;
       -webkit-font-smoothing:antialiased}
  .app{max-width:640px;margin:0 auto;padding:26px 18px 56px}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:1.9rem;margin:0 0 6px;letter-spacing:-.01em}
  .sub{margin:0 0 18px;color:var(--text-muted);font-size:.93rem;line-height:1.5;max-width:46ch}
  .welcome{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;
    padding:16px 18px;margin:0 0 22px;max-width:52ch}
  .welcome p{margin:0 0 11px;font-size:.93rem;line-height:1.6;color:var(--text)}
  .welcome p:last-child{margin-bottom:0;color:var(--text-muted)}
  .modetoggle{flex:0 0 auto;font-size:.76rem;font-weight:600;border:1px solid var(--border);
    background:var(--card-bg);color:var(--text-muted);border-radius:100px;padding:6px 12px;
    cursor:pointer;font-family:inherit}
  .modetoggle.on{background:var(--text);color:#fff;border-color:var(--text)}
  .me{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card-bg);
    border:1px solid var(--border);border-radius:9px;padding:10px 12px;margin-bottom:18px;font-size:.85rem}
  .me span{color:var(--text-muted)} .me strong{color:var(--text);font-weight:600}
  .gate{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:18px}
  .gate h2{font-family:'Fraunces',serif;font-size:1.2rem;font-weight:500;margin:0 0 6px}
  .gate p{color:var(--text-muted);font-size:.88rem;line-height:1.5;margin:0 0 14px}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:20px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--border);background:var(--card-bg);color:var(--text);
    font-family:inherit;font-size:.81rem;font-weight:500;padding:7px 13px;border-radius:100px;
    cursor:pointer;white-space:nowrap}
  .chip.active{background:var(--text);border-color:var(--text);color:#fff}
  .section-title{font-family:'Fraunces',serif;font-size:1.12rem;font-weight:500;margin:28px 0 4px}
  .section-sub{color:var(--text-muted);font-size:.84rem;margin:0 0 12px;line-height:1.45}
  .empty{color:var(--text-muted);font-size:.89rem;padding:14px 0;border-top:1px solid var(--border)}
  .row{display:flex;gap:13px;padding:16px 2px 16px 14px;border-top:1px solid var(--border);position:relative}
  .row::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:2px;
    background:var(--cat-color,var(--grey))}
  .row.filled{opacity:.88} .row.mine::before{width:6px}
  .when{flex:0 0 84px;font-family:'Fraunces',serif;font-size:.9rem;line-height:1.35;padding-top:1px}
  .when .time{display:block;color:var(--text-muted);font-family:'Inter',sans-serif;font-size:.76rem;margin-top:2px}
  .bd{flex:1;min-width:0}
  .ttl{font-weight:600;font-size:.97rem;margin:0 0 3px}
  .loc{color:var(--text-muted);font-size:.83rem;margin:0 0 6px}
  .instr{color:var(--text-muted);font-size:.83rem;line-height:1.45;margin:0 0 10px}
  .btn{font-family:inherit;font-size:.83rem;font-weight:600;border:none;border-radius:7px;
    padding:9px 15px;cursor:pointer}
  .btn.primary{background:var(--text);color:#fff}
  .btn.primary[disabled]{opacity:.5;cursor:default}
  .btn.ghost{background:transparent;color:var(--text-muted);padding-left:0;text-decoration:underline}
  .btn.small{font-size:.78rem;padding:6px 11px}
  .btn.link{background:transparent;color:var(--text-muted);font-size:.78rem;padding:4px 0;
    text-decoration:underline;font-weight:500}
  .vol{font-size:.85rem;margin:0 0 4px} .vol strong{font-weight:600}
  .yours{display:inline-block;font-size:.71rem;font-weight:600;color:var(--sage);border:1px solid var(--sage);
    border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:1px}
  input{width:100%;font-family:inherit;font-size:.92rem;padding:10px;border:1px solid var(--border);
    border-radius:6px;margin-bottom:9px;background:var(--bg);color:var(--text)}
  .hint{color:var(--text-muted);font-size:.76rem;margin:-4px 0 10px;line-height:1.4}
  label{display:block;font-size:.78rem;font-weight:600;color:var(--text);margin:2px 0 5px}
  .req{font-weight:500;color:var(--rose);font-size:.72rem;margin-left:4px}
  .opt{font-weight:500;color:var(--text-muted);font-size:.72rem;margin-left:4px}
  .field-row{display:flex;gap:10px}
  .field-half{flex:1;min-width:0}
  .field-err{color:var(--rose);font-size:.74rem;margin:-5px 0 8px;line-height:1.35}
  input.bad{border-color:var(--rose)}
  .assign{border:1px solid var(--border);background:var(--card-bg);border-radius:10px;
    padding:13px;margin-bottom:11px}
  .assign h4{margin:0 0 2px;font-size:.94rem;font-weight:600}
  .assign .ameta{color:var(--text-muted);font-size:.81rem;margin:0 0 9px;line-height:1.45}
  .assign input{font-size:.87rem;padding:8px 10px;margin-bottom:7px}
  .arow{display:flex;gap:8px}
  .arow input{flex:1;min-width:0}
  .journey{display:block;width:100%;text-align:left;background:var(--card-bg);
    border:1px solid var(--border);border-radius:10px;padding:13px 15px;
    margin:0 0 20px;cursor:pointer;font-family:inherit}
  .journey strong{display:block;font-size:.95rem;font-weight:600;color:var(--text);margin-bottom:3px}
  .journey span{font-size:.83rem;color:var(--text-muted);line-height:1.45}
  .tierrow{display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:11px 0;border-top:1px solid var(--border)}
  .tierrow .who{min-width:0}
  .tierrow .who strong{font-weight:600;font-size:.88rem}
  .tierrow .em{color:var(--text-muted);font-size:.79rem}
  .tierbtns{display:flex;gap:6px;flex:0 0 auto}
  .tierbtns button{font-size:.75rem;font-weight:600;padding:6px 10px;border-radius:6px;
    border:1px solid var(--border);background:var(--card-bg);color:var(--text-muted);
    cursor:pointer;font-family:inherit}
  .tierbtns button.on{background:var(--text);border-color:var(--text);color:#fff}
  .postrow{border:1px solid var(--border);background:var(--card-bg);border-radius:10px;
    padding:13px;margin-bottom:10px}
  .postrow h4{margin:0 0 2px;font-size:.94rem;font-weight:600}
  .postrow .pmeta{color:var(--text-muted);font-size:.79rem;margin:0 0 9px}
  .postrow .excerpt{color:var(--text-muted);font-size:.84rem;line-height:1.5;margin:0 0 11px}
  .postbtns{display:flex;gap:6px;flex-wrap:wrap}
  .postbtns button{font-size:.75rem;font-weight:600;padding:6px 10px;border-radius:6px;
    border:1px solid var(--border);background:var(--card-bg);color:var(--text-muted);
    cursor:pointer;font-family:inherit}
  .postbtns button.on{background:var(--text);border-color:var(--text);color:#fff}
  .postbtns button.danger{color:var(--rose);border-color:var(--rose)}
  .err{color:var(--rose);font-size:.79rem;margin:-2px 0 9px;line-height:1.4}
  .invite{border:1px solid var(--border);background:var(--card-bg);border-radius:10px;padding:14px;margin-bottom:12px}
  .invite h4{margin:0 0 2px;font-size:.95rem;font-weight:600}
  .invite .meta{color:var(--text-muted);font-size:.82rem;margin:0 0 10px}
  .field{margin-bottom:10px}
  .field label{display:block;font-size:.75rem;font-weight:600;color:var(--text-muted);margin-bottom:4px}
  .field textarea,.field .copyline{width:100%;font-family:inherit;font-size:.84rem;padding:8px 10px;
    border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);line-height:1.5}
  .field textarea{min-height:88px;resize:vertical}
  .copied{color:var(--sage);font-size:.76rem;font-weight:600;margin-left:8px}
  .person{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--border);font-size:.86rem}
  .person .em{color:var(--text-muted);font-size:.8rem}
  .status{color:var(--text-muted);font-size:.88rem;padding:20px 0}
  .banner{background:var(--card-bg);border:1px solid var(--rose);color:var(--rose);border-radius:8px;
    padding:10px 12px;font-size:.84rem;margin-bottom:14px;line-height:1.45}
</style>
</head>
<body>
<div class="app" id="root">
  <div class="topbar">
    <div><h1 id="h1">For Tracey</h1><p class="sub" id="sub"></p></div>
    <button class="modetoggle" id="mode">Coordinator</button>
  </div>
  <div id="content" class="status">Loading…</div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function () {
  var cfg = window.TRACEY_CONFIG || {};
  var content = document.getElementById('content');
  var modeBtn = document.getElementById('mode');
  var h1 = document.getElementById('h1'), sub = document.getElementById('sub');

  if (!cfg.SUPABASE_URL || cfg.SUPABASE_URL.indexOf('YOUR-PROJECT') !== -1) {
    content.innerHTML = '<div class="banner">config.js still has placeholder values. Add your Supabase project URL and anon key, then reload.</div>';
    modeBtn.style.display = 'none';
    return;
  }
  var db = supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);

  var CATS = [
    {key:'rides',   label:'Rides',    color:'var(--sage)'},
    {key:'izzy',    label:'Izzy',     color:'var(--clay)'},
    {key:'walks',   label:'Walks',    color:'var(--ochre)'},
    {key:'errands', label:'Errands',  color:'var(--slate)'},
    {key:'other',   label:'Other',    color:'var(--grey)'}
  ];
  var catBy = {}; CATS.forEach(function(c){ catBy[c.key] = c; });

  var needs = [], coordData = null, me = null, cat = 'all';
  var access = null;   // {access:'none'|'approved'|'close', requested:bool}
  var posts = null;    // Tracey's journal, coordinator view only
  var coord = false, pass = '', copiedKey = null, notice = '', busy = null, poll = null;

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function fmtD(iso){ return new Date(iso+'T00:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}); }
  function fmtL(iso){ return new Date(iso+'T00:00:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'}); }
  function first(n){ return String(n||'').split(' ')[0]; }

  function lsGet(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } }
  function lsSet(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
  me = lsGet('tracey_me');

  async function loadNeeds(){
    // Whether this person can read Tracey's journal, and whether they
    // have already asked. Failure here must never block the needs list.
    if (me) {
      try {
        var ar = await db.rpc('my_access', { p_email: me.email });
        if (!ar.error && ar.data) access = ar.data;
      } catch (e) {}
    }
    var r = await db.rpc('list_needs', { p_email: me ? me.email : null });
    if (r.error) { notice = 'Could not reach the schedule. Check your connection and reload.'; }
    else { needs = r.data || []; notice = ''; }
    render();
  }

  async function loadCoord(){
    // Posts are a separate call so a journal problem cannot stop the
    // rest of the coordinator view loading.
    try {
      var pr = await db.rpc('coordinator_posts', { p_pass: pass });
      posts = pr.error ? [] : (pr.data || []);
    } catch (e) { posts = []; }

    var r = await db.rpc('coordinator_data', { p_pass: pass });
    if (r.error) { coordData = null; notice = 'That passphrase was not accepted.'; pass=''; }
    else { coordData = r.data; notice = ''; }
    render();
  }

  function startPoll(){
    if (poll) return;
    poll = setInterval(function(){ if(!coord && me) loadNeeds(); }, 10000);
  }

  // Tells the coordinators that something changed. Deliberately not
  // awaited: a slow or failing email must never hold up the page or
  // stop someone signing up.
  // Lets the coordinator know someone has asked to read the journal.
  // Fire and forget, like the other notifications.
  function notifyAccess(email, name) {
    try {
      fetch('/api/notify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'access-request', email: email, name: name })
      }).catch(function(){});
    } catch (e) {}
  }

  function notify(id, action) {
    try {
      fetch('/api/notify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: id, action: action })
      }).catch(function(){});
    } catch (e) {}
  }

  function inviteBody(n){
    return ['Volunteer: ' + (n.volunteer_name||''), 'Status: FILLED', '',
      n.location ? ('Where: ' + n.location) : '', '',
      n.instructions||'', '',
      'Thank you so much for helping. If something changes on your end, release the slot on the signup page and we will find someone else.'
    ].join('\n');
  }

  function gate(){
    return '<div class="gate"><h2>Add yourself first</h2>'
      + '<p>We need your email so we can send you the calendar invitation when you sign up for something. '
      + 'That way you get reminders, and if a time changes your calendar updates on its own — no texts needed.</p>'
      + '<div class="field-row">'
      +   '<div class="field-half">'
      +     '<label for="r-first">First name <span class="req">required</span></label>'
      +     '<input type="text" id="r-first" autocomplete="given-name" autocapitalize="words" />'
      +     '<div class="field-err" id="e-first"></div>'
      +   '</div>'
      +   '<div class="field-half">'
      +     '<label for="r-last">Last name <span class="req">required</span></label>'
      +     '<input type="text" id="r-last" autocomplete="family-name" autocapitalize="words" />'
      +     '<div class="field-err" id="e-last"></div>'
      +   '</div>'
      + '</div>'
      + '<label for="r-email">Email <span class="req">required</span></label>'
      + '<input type="email" id="r-email" autocomplete="email" inputmode="email" autocapitalize="none" placeholder="so we can send you the invitation" />'
      + '<div class="field-err" id="e-email"></div>'
      + '<label for="r-phone">Phone <span class="opt">optional</span></label>'
      + '<input type="tel" id="r-phone" autocomplete="tel" inputmode="tel" />'
      + '<p class="hint">Other friends only see your first name. The rest is so Tracey and the coordinators know exactly who is coming.</p>'
      + '<p class="hint">Been here before? Enter the same email and everything you have signed up for comes straight back.</p>'
      + '<p class="hint">Only Tracey and the coordinators see your contact details. Other friends just see your first name next to what you have signed up for.</p>'
      + '<div class="err" id="r-err" style="display:none"></div>'
      + '<button class="btn primary" data-action="register">Continue</button></div>';
  }

  // The journal entry point. Always visible, so nobody has to be told
  // it exists. What it does depends on where they stand.
  function journeyButton() {
    var state = access ? access.access : 'none';
    if (state === 'approved' || state === 'close') {
      return '<button class="journey" data-action="journal">'
        + '<strong>Tracey\u2019s journey</strong>'
        + '<span>Her own words on how things are going.</span></button>';
    }
    if (access && access.requested) {
      return '<button class="journey" data-action="journey-pending">'
        + '<strong>Tracey\u2019s journey</strong>'
        + '<span>You have asked to read her updates. Wud will let you in shortly.</span></button>';
    }
    return '<button class="journey" data-action="journey-ask">'
      + '<strong>Tracey\u2019s journey</strong>'
      + '<span>She writes about how things are going. Tap to ask for access.</span></button>';
  }

  function row(n){
    var c = catBy[n.category] || catBy.other;
    var filled = n.status === 'FILLED';
    var mine = filled && n.is_mine === true;
    var act;
    if (filled) {
      act = '<p class="vol">Covered by <strong>' + esc(mine ? 'you' : (n.volunteer_name || 'a friend')) + '</strong>'
          + (mine ? '<span class="yours">yours</span>' : '') + '</p>'
          + (mine ? '<button class="btn ghost" data-action="release" data-id="'+n.id+'">Can\'t make it anymore? Free up this slot</button>' : '');
    } else {
      var b = busy === n.id;
      act = '<button class="btn primary" data-action="claim" data-id="'+n.id+'"'+(b?' disabled':'')+'>'
          + (b ? 'Signing you up…' : 'I can help') + '</button>';
    }
    return '<div class="row '+(filled?'filled':'')+' '+(mine?'mine':'')+'" style="--cat-color:'+c.color+'">'
      + '<div class="when">'+fmtD(n.date)+'<span class="time">'+esc(n.start_time)+'–'+esc(n.end_time)+'</span></div>'
      + '<div class="bd"><p class="ttl">'+esc(n.title)+'</p>'
      + (n.location ? '<p class="loc">'+esc(n.location)+'</p>' : '')
      + (!filled ? '<p class="instr">'+esc(n.instructions)+'</p>' : '')
      + act + '</div></div>';
  }

  function inviteCard(n){
    var c = function(k){ return copiedKey===k ? '<span class="copied">Copied</span>' : ''; };
    return '<div class="invite"><h4>'+esc(n.title)+' — '+esc(first(n.volunteer_name))+'</h4>'
      + '<p class="meta">'+fmtL(n.date)+', '+esc(n.start_time)+'–'+esc(n.end_time)+'</p>'
      + '<div class="field"><label>Add as attendee'+c('e'+n.id)+'</label>'
      + '<input class="copyline" readonly value="'+esc(n.volunteer_email)+'" data-action="copy" data-key="e'+n.id+'" data-copy="'+esc(n.volunteer_email)+'" /></div>'
      + '<div class="field"><label>Event body'+c('b'+n.id)+'</label>'
      + '<textarea readonly data-action="copy" data-key="b'+n.id+'" data-copy="'+esc(inviteBody(n))+'">'+esc(inviteBody(n))+'</textarea></div>'
      + '<button class="btn primary small" data-action="invited" data-id="'+n.id+'">Mark invite sent</button></div>';
  }

  function render(){
    modeBtn.textContent = coord ? 'Friend view' : 'Coordinator';
    modeBtn.className = 'modetoggle' + (coord ? ' on' : '');
    content.className = '';
    var banner = notice ? '<div class="banner">'+esc(notice)+'</div>' : '';

    if (coord) {
      h1.textContent = 'Coordinator';
      if (!coordData) {
        sub.textContent = '';
        content.innerHTML = banner + '<div class="gate"><h2>Coordinator access</h2>'
          + '<p>Enter the passphrase to see volunteer contact details and pending invites.</p>'
          + '<input type="password" id="c-pass" placeholder="Passphrase" />'
          + '<button class="btn primary" data-action="unlock">Unlock</button></div>';
        return;
      }
      sub.textContent = 'Claims waiting on an Outlook invite, and everyone who has registered.';
      var all = coordData.needs || [], vols = coordData.volunteers || [];
      var pend = all.filter(function(n){ return n.status==='FILLED' && !n.invited; });
      var openOnes = all.filter(function(n){ return n.status === 'OPEN'; });
      var claimed  = all.filter(function(n){ return n.status === 'FILLED'; });

      // Everyone registered, offered as suggestions so assigning a
      // returning friend is a tap rather than retyping their address.
      var roster = '<datalist id="roster">' + vols.map(function(v){
        return '<option value="' + esc(v.email) + '">' + esc(v.name) + '</option>';
      }).join('') + '</datalist>';

      function assignCard(n) {
        return '<div class="assign">'
          + '<h4>' + esc(n.title) + '</h4>'
          + '<p class="ameta">' + fmtL(n.date) + ', ' + esc(n.start_time) + '</p>'
          + '<div class="arow">'
          +   '<input type="text" id="an-' + n.id + '" placeholder="Name" autocapitalize="words" />'
          +   '<input type="email" id="ae-' + n.id + '" placeholder="Email" list="roster" autocapitalize="none" inputmode="email" />'
          + '</div>'
          + '<div class="field-err" id="aerr-' + n.id + '"></div>'
          + '<button class="btn primary small" data-action="assign" data-id="' + n.id + '">Sign them up</button>'
          + '</div>';
      }

      function claimedCard(n) {
        return '<div class="assign">'
          + '<h4>' + esc(n.title) + '</h4>'
          + '<p class="ameta">' + fmtL(n.date) + ', ' + esc(n.start_time) + '<br>'
          +   '<strong>' + esc(n.volunteer_name || '') + '</strong>'
          +   (n.volunteer_email ? ' \u00b7 ' + esc(n.volunteer_email) : '')
          +   (n.invited ? ' \u00b7 invite sent' : ' \u00b7 invite not sent yet') + '</p>'
          + '<button class="btn ghost" data-action="unassign" data-id="' + n.id + '">They cancelled \u2014 free this up</button>'
          + '</div>';
      }

      var pending = coordData.pending || [];

      function pendingRow(p) {
        return '<div class="tierrow">'
          + '<div class="who"><strong>' + esc(p.name) + '</strong>'
          +   '<div class="em">' + esc(p.email) + '</div></div>'
          + '<div class="tierbtns">'
          +   '<button data-action="settier" data-email="' + esc(p.email) + '" data-level="approved">Approve</button>'
          +   '<button data-action="settier" data-email="' + esc(p.email) + '" data-level="none">Not now</button>'
          + '</div></div>';
      }

      // Three tiers. Close is dormant for now \u2014 it shows the same
      // journal plus anything Tracey keeps to a smaller circle. Nobody
      // on a lower tier sees any sign that those posts exist.
      function tierRow(p) {
        var lvl = p.access || 'none';
        function b(level, label) {
          return '<button data-action="settier" data-email="' + esc(p.email) + '"'
            + ' data-level="' + level + '"'
            + (lvl === level ? ' class="on"' : '') + '>' + label + '</button>';
        }
        return '<div class="tierrow">'
          + '<div class="who"><strong>' + esc(p.name) + '</strong>'
          +   '<div class="em">' + esc(p.email)
          +   (p.phone ? ' \u00b7 ' + esc(p.phone) : '') + '</div></div>'
          + '<div class="tierbtns">'
          +   b('none', 'No') + b('approved', 'Updates') + b('close', 'Close')
          + '</div></div>';
      }

      function postRow(p) {
        var vis = p.visibility || 'approved';
        var text = String(p.body || '').replace(/[#*>_`\-]/g, ' ')
                     .replace(/\s+/g, ' ').trim();
        var excerpt = text.length > 150 ? text.slice(0, 150) + '\u2026' : text;
        function b(level, label) {
          return '<button data-action="setvis" data-id="' + p.id + '"'
            + ' data-vis="' + level + '"'
            + (vis === level ? ' class="on"' : '') + '>' + label + '</button>';
        }
        return '<div class="postrow">'
          + '<h4>' + esc(p.title) + '</h4>'
          + '<p class="pmeta">' + fmtL(String(p.published).slice(0, 10))
          +   (vis === 'hidden' ? ' \u00b7 hidden from everyone'
              : vis === 'close' ? ' \u00b7 close circle only'
              : ' \u00b7 everyone approved') + '</p>'
          + (excerpt ? '<p class="excerpt">' + esc(excerpt) + '</p>' : '')
          + '<div class="postbtns">'
          +   b('approved', 'Everyone') + b('close', 'Close') + b('hidden', 'Hide')
          +   '<button class="danger" data-action="delpost" data-id="' + p.id + '">Delete</button>'
          + '</div></div>';
      }

      content.innerHTML = banner
        + '<div class="section-title">Needs an invite</div>'
        + '<div class="section-sub">' + (pend.length ? 'Add these attendees to the event on the Tracey Recovery calendar, then send the update.' : '') + '</div>'
        + (pend.length ? pend.map(inviteCard).join('') : '<div class="empty">All caught up. Every claimed need has an invite out.</div>')
        + '<div class="section-title">Sign someone up</div>'
        + '<div class="section-sub">' + (openOnes.length ? 'For friends who phone rather than use the page. They get the same calendar invitation.' : '') + '</div>'
        + roster
        + (openOnes.length ? openOnes.map(assignCard).join('') : '<div class="empty">Nothing open right now.</div>')
        + '<div class="section-title">Covered</div>'
        + '<div class="section-sub">' + (claimed.length ? 'Free one up here if someone cancels by phone.' : '') + '</div>'
        + (claimed.length ? claimed.map(claimedCard).join('') : '<div class="empty">Nothing claimed yet.</div>')
        + '<div class="section-title">Tracey\u2019s posts</div>'
        + '<div class="section-sub">' + ((posts && posts.length)
            ? 'Hide one if she reposts a correction. Nobody is told a post exists that they cannot see.'
            : 'She has not sent anything yet.') + '</div>'
        + ((posts && posts.length) ? posts.map(postRow).join('')
            : '<div class="empty">No posts yet.</div>')
        + '<div class="section-title">Waiting to read her updates</div>'
        + '<div class="section-sub">' + (pending.length
            ? 'They have asked to read Tracey\u2019s journey. Nobody sees the journal until you approve.'
            : '') + '</div>'
        + (pending.length ? pending.map(pendingRow).join('')
            : '<div class="empty">No one waiting.</div>')
        + '<div class="section-title">Registered friends</div>'
        + '<div class="section-sub">'+vols.length+' '+(vols.length===1?'person has':'people have')+' added themselves. '
        + 'Approved friends can read her updates; nobody is told which level they are on.</div>'
        + (vols.length ? vols.map(tierRow).join('')
          : '<div class="empty">Nobody registered yet.</div>');
      return;
    }

    h1.textContent = 'For Tracey';
    if (!me) {
      sub.textContent = '';
      content.innerHTML = banner
        + '<div class="welcome">'
        + '<p>Tracey is working her way back, and a lot of you have asked how you can help. '
        + 'This page is the answer.</p>'
        + '<p>Everything she needs is listed here — rides to rehab, walks, company, errands, '
        + 'a hand with Izzy. Take whatever fits your week. You will see what is already covered, '
        + 'so nothing gets doubled up and nobody has to coordinate.</p>'
        + '<p>Thank you. It matters more than you know.</p></div>'
        + gate();
      return;
    }
    sub.textContent = 'Pick anything you can take. Everyone sees the same list, so nothing gets doubled up.';

    var list = cat === 'all' ? needs : needs.filter(function(n){ return n.category === cat; });
    var open = list.filter(function(n){ return n.status === 'OPEN'; });
    var cov  = list.filter(function(n){ return n.status === 'FILLED'; });
    var chips = [{key:'all',label:'All'}].concat(CATS).map(function(c){
      return '<button class="chip '+(cat===c.key?'active':'')+'" data-action="filter" data-cat="'+c.key+'">'+c.label+'</button>';
    }).join('');

    var welcome = '<div class="welcome">'
      + '<p>Tracey is working her way back, and a lot of you have asked how you can help. '
      + 'This page is the answer.</p>'
      + '<p>Everything she needs is listed below — rides to rehab, walks, company, errands, '
      + 'a hand with Izzy. Take whatever fits your week. You will see what is already covered, '
      + 'so nothing gets doubled up and nobody has to coordinate.</p>'
      + '<p>Thank you. It matters more than you know.</p></div>';

    content.innerHTML = banner + welcome
      + '<div class="me"><span>Signed in as <strong>'+esc(me.name)+'</strong> · '+esc(me.email)+'</span>'
      + '<button class="btn link" data-action="editme">Change</button></div>'
      + journeyButton()
      + '<div class="chips">'+chips+'</div>'
      + '<div class="section-title">Open needs</div>'
      + '<div class="section-sub">'+(open.length ? 'One tap signs you up — the invitation goes to your email.' : '')+'</div>'
      + (open.length ? open.map(row).join('') : '<div class="empty">Everything\u2019s covered right now. Check back soon, or see what\u2019s already handled below.</div>')
      + '<div class="section-title">Already covered</div>'
      + (cov.length ? cov.map(row).join('') : '<div class="empty">Nothing covered yet.</div>');
  }

  modeBtn.addEventListener('click', function(){
    coord = !coord; notice = '';
    if (coord && !coordData) render(); else if (!coord) render(); else loadCoord();
  });

  document.getElementById('root').addEventListener('click', async function(e){
    var el = e.target.closest('[data-action]'); if (!el) return;
    var a = el.getAttribute('data-action'), id = el.getAttribute('data-id');

    if (a === 'copy') {
      var t = el.getAttribute('data-copy');
      try { el.select && el.select(); } catch(x){}
      if (navigator.clipboard) navigator.clipboard.writeText(t).then(function(){
        copiedKey = el.getAttribute('data-key'); render(); }).catch(function(){});
      return;
    }
    if (a === 'filter') { cat = el.getAttribute('data-cat'); render(); return; }
    if (a === 'editme') { me = null; lsSet('tracey_me', null); render(); return; }

    if (a === 'unlock') {
      pass = (document.getElementById('c-pass').value || '').trim();
      if (!pass) return;
      await loadCoord(); return;
    }

    if (a === 'register') {
      var fEl = document.getElementById('r-first');
      var lEl = document.getElementById('r-last');
      var eEl = document.getElementById('r-email');
      var err = document.getElementById('r-err');

      var first = (fEl.value || '').trim();
      var last  = (lEl.value || '').trim();
      var email = (eEl.value || '').trim().toLowerCase();
      var phone = (document.getElementById('r-phone').value || '').trim();

      // Typing a whole name into the first box is a common slip. Move the
      // surplus across rather than making anyone retype.
      if (!last && first.indexOf(' ') > 0) {
        var parts = first.split(/\s+/);
        first = parts.shift();
        last  = parts.join(' ');
        fEl.value = first;
        lEl.value = last;
      }

      function fail(el, slot, msg) {
        document.getElementById(slot).textContent = msg;
        el.classList.add('bad');
      }
      function clearField(el, slot) {
        document.getElementById(slot).textContent = '';
        el.classList.remove('bad');
      }
      clearField(fEl, 'e-first'); clearField(lEl, 'e-last'); clearField(eEl, 'e-email');
      err.style.display = 'none';

      var ok = true;
      if (first.length < 2) { fail(fEl, 'e-first', 'Please give your first name.'); ok = false; }
      if (last.length < 2)  { fail(lEl, 'e-last', 'Last name too, so Tracey knows which friend this is.'); ok = false; }
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
        fail(eEl, 'e-email', 'An email address that can receive calendar invitations.'); ok = false;
      }
      if (!ok) return;

      // Stored as one string, shown in full to friends and coordinators.
      var name = first + ' ' + last;
      var r = await db.rpc('register_volunteer', { p_email: email, p_name: name, p_phone: phone });
      if (r.error) { err.textContent = 'Could not save that just now. Check your connection and try again.'; err.style.display='block'; return; }
      me = { name: name, email: email, phone: phone };
      // Welcome back message if we already knew this address.
      try {
        var known = await db.rpc('find_volunteer', { p_email: email });
        if (known && known.data && known.data.name) { me.name = name || known.data.name; }
      } catch (e) {}
      lsSet('tracey_me', me);
      await loadNeeds(); return;
    }

    if (a === 'claim') {
      if (!me || busy) return;
      busy = id; render();
      var r = await db.rpc('claim_need', { p_id: id, p_email: me.email, p_name: me.name });
      busy = null;
      if (r.error) { notice = 'Could not sign you up just now. Please try again.'; }
      else if (r.data === true) {
        notice = '';
        notify(id, 'claimed');
        // Signing up for the first time also asks to read her updates,
        // so nobody has to think of requesting it.
        if (access && access.access === 'none' && !access.requested) {
          try {
            var jr2 = await db.rpc('request_access', { p_email: me.email });
            if (!jr2.error) {
              access = { access: 'none', requested: true };
              if (jr2.data && jr2.data.new) notifyAccess(me.email, me.name);
            }
          } catch (e) {}
        }
      }
      else { notice = 'Someone else just took that one. Here is the updated list.'; }
      await loadNeeds(); return;
    }

    if (a === 'release') {
      if (!window.confirm('Free up this slot so someone else can take it?')) return;
      var rr = await db.rpc('release_need', { p_id: id, p_email: me.email });
      if (rr.error || rr.data !== true) { notice = 'Could not release that. Please refresh and try again.'; }
      else { notice = ''; notify(id, 'released'); }
      await loadNeeds(); return;
    }

    if (a === 'journey-ask') {
      if (!window.confirm(
        'Tracey writes about how her recovery is going.\n\n' +
        'Reading it needs Wud to approve you first. Send the request?')) return;
      var jr = await db.rpc('request_access', { p_email: me.email });
      if (jr.error) { notice = 'Could not send that just now. Please try again.'; render(); return; }
      access = { access: 'none', requested: true };
      if (jr.data && jr.data.new) notifyAccess(me.email, me.name);
      window.alert('Asked. Wud will let you in shortly.');
      render();
      return;
    }

    if (a === 'journey-pending') {
      window.alert('Your request is with Wud. You will be able to read her updates once he approves.');
      return;
    }

    if (a === 'journal') {
      window.location.href = '/journal';
      return;
    }

    if (a === 'setvis') {
      var vis = el.getAttribute('data-vis');
      el.disabled = true;
      var vr = await db.rpc('set_post_visibility', { p_pass: pass, p_id: id, p_visibility: vis });
      el.disabled = false;
      if (vr.error || !vr.data || vr.data.ok !== true) {
        notice = 'Could not change that. Please try again.'; render(); return;
      }
      await loadCoord();
      return;
    }

    if (a === 'delpost') {
      if (!window.confirm('Delete this post for good? Hiding it keeps it in case she changes her mind.')) return;
      var dr = await db.rpc('delete_post', { p_pass: pass, p_id: id });
      if (dr.error || !dr.data || dr.data.ok !== true) {
        notice = 'Could not delete that. Please try again.'; render(); return;
      }
      await loadCoord();
      return;
    }

    if (a === 'settier') {
      var em = el.getAttribute('data-email');
      var lvl = el.getAttribute('data-level');
      el.disabled = true;
      var sr = await db.rpc('set_access', { p_pass: pass, p_email: em, p_level: lvl });
      el.disabled = false;
      if (sr.error || !sr.data || sr.data.ok !== true) {
        notice = 'Could not change that. Please try again.'; render(); return;
      }
      await loadCoord();
      return;
    }

    if (a === 'assign') {
      var nEl = document.getElementById('an-' + id);
      var eEl2 = document.getElementById('ae-' + id);
      var slot = document.getElementById('aerr-' + id);
      var nm = (nEl.value || '').trim();
      var em = (eEl2.value || '').trim().toLowerCase();

      slot.textContent = '';
      if (nm.length < 2) { slot.textContent = 'Their name, so Tracey knows who is coming.'; return; }
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) {
        slot.textContent = 'An email address that can receive the calendar invitation.'; return;
      }

      el.disabled = true;
      el.textContent = 'Signing up\u2026';
      var ar = await db.rpc('assign_need', {
        p_pass: pass, p_id: id, p_name: nm, p_email: em, p_phone: ''
      });
      el.disabled = false;
      el.textContent = 'Sign them up';

      if (ar.error) { slot.textContent = 'Could not do that just now. Try again.'; return; }
      if (!ar.data || ar.data.ok !== true) {
        slot.textContent = (ar.data && ar.data.reason) ? ar.data.reason : 'Could not sign them up.';
        return;
      }
      // Same notification and invitation path a friend's own claim takes.
      notify(id, 'claimed');
      await loadCoord();
      return;
    }

    if (a === 'unassign') {
      if (!window.confirm('Free this up so someone else can take it?')) return;
      var ur = await db.rpc('unassign_need', { p_pass: pass, p_id: id });
      if (ur.error || !ur.data || ur.data.ok !== true) {
        notice = 'Could not free that up. Refresh and try again.';
        render(); return;
      }
      notify(id, 'released');
      if (ur.data.was_invited) {
        window.alert('Freed up. They were already on the Outlook invite \u2014 remember to remove them from the event.');
      }
      await loadCoord();
      return;
    }

    if (a === 'invited') {
      var mi = await db.rpc('mark_invited', { p_id: id, p_pass: pass });
      if (mi.error) { notice = 'Could not update that.'; render(); return; }
      await loadCoord(); return;
    }
  });

  loadNeeds().then(startPoll);
})();
</script>
</body>
</html>
