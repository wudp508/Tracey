        + '<div class="section-sub">'+vols.length+' '+(vols.length===1?'person has':'people have')+' added themselves. '
        + 'Approved friends can read her updates; nobody is told which level they are on.</div>'
        + (vols.length ? vols.map(tierRow).join('')
          : '<div class="empty">Nobody registered yet.</div>');
      return;
    }

    h1.textContent = 'For Tracey';
    if (!me) {
      sub.textContent = '';
      content.innerHTML = banner
        + '<div class="welcome">'
        + '<p>Tracey is working her way back, and a lot of you have asked how you can help. '
        + 'This page is the answer.</p>'
        + '<p>Everything she needs is listed here — rides to rehab, walks, company, shopping, '
        + 'a hand with Izzy. Take whatever fits your week. You will see what is already covered, '
        + 'so nothing gets doubled up and nobody has to coordinate.</p>'
        + '<p>Thank you. It matters more than you know.</p></div>'
        + (showHelp ? helpPanel() : '')
        + gate();
      return;
    }
    sub.textContent = 'Pick anything you can take. Everyone sees the same list, so nothing gets doubled up.';

    var list = cat === 'all' ? needs : needs.filter(function(n){ return n.category === cat; });
    var open = list.filter(function(n){ return n.status === 'OPEN'; });
    // Their own are shown at the top in full, so they are not repeated
    // here.
    var cov  = list.filter(function(n){
      return n.status === 'FILLED' && n.is_mine !== true; });
    // How many are actually open in each category. Counting everything
    // would include things already covered, which is not a number a
    // friend can do anything with.
    var openAll = needs.filter(function(n){ return n.status === 'OPEN'; });
    var counts = { all: openAll.length };
    CATS.forEach(function(c){ counts[c.key] = 0; });
    openAll.forEach(function(n){
      var k = catBy[n.category] ? catBy[n.category].key : 'other';
      counts[k] = (counts[k] || 0) + 1;
    });

    var chips = [{key:'all',label:'All'}].concat(CATS).map(function(c){
      var n = counts[c.key] || 0;
      // No number on All. It is the default view, so the count describes
      // the list already on screen. The category numbers earn their
      // place because they say what is behind a tap nobody has made.
      var showN = c.key !== 'all' && n > 0;
      return '<button class="chip ' + (cat === c.key ? 'active' : '')
        + (c.key !== 'all' && n === 0 ? ' bare' : '')
        + '" data-action="filter" data-cat="' + c.key + '">' + c.label
        + (showN ? '<span class="n">' + n + '</span>' : '')
        + '</button>';
    }).join('');

    // The welcome note earns its place once, on the registration screen.
    // A returning friend gets the one-line subtitle under the title and
    // nothing else, because they came for the list.

    // Beyond a fortnight, a daily series would bury everything. Friends
    // can see the rest, they just have to ask for it.
    var HORIZON_DAYS = 14;
    var cutoff = new Date();
    cutoff.setDate(cutoff.getDate() + HORIZON_DAYS);
    var cutoffStr = cutoff.toISOString().slice(0, 10);

    // An untimed request has no date, and comparing null against a date
    // string is false — which quietly hid every one of them behind a
    // horizon they were never subject to.
    // Sorted before anything is sliced off, or "the first six" would
    // mean whatever order the database happened to return.
    open = open.slice().sort(function(a, b){
      var ao = (a.partner_id && a.partner_status === 'FILLED') ? 0 : 1;
      var bo = (b.partner_id && b.partner_status === 'FILLED') ? 0 : 1;
      if (ao !== bo) return ao - bo;
      var aa = a.anytime ? 0 : 1, ba = b.anytime ? 0 : 1;
      if (aa !== ba) return aa - ba;
      if (!a.date && !b.date) return 0;
      if (!a.date) return -1;
      if (!b.date) return 1;
      if (a.date !== b.date) return a.date < b.date ? -1 : 1;
      return 0;
    });

    var withinHorizon = open.filter(function(n){
      if (n.anytime) return true;
      return n.date && n.date <= cutoffStr;
    });

    // A two-week window is right when there is plenty and wrong when
    // there is not: a friend who opens the page and sees one thing
    // concludes there is nothing to do and closes it. So the window is a
    // floor, not a ceiling — it stretches until there is something worth
    // looking at, or until there is nothing left to show.
    var MIN_SHOWN = 6;
    var openSoon;
    if (showAll) {
      openSoon = open;
    } else if (withinHorizon.length >= MIN_SHOWN) {
      openSoon = withinHorizon;
    } else {
      openSoon = open.slice(0, Math.max(MIN_SHOWN, withinHorizon.length));
    }

    // A half-covered appointment is the most urgent thing on the page:
    // somebody is already relying on one leg. Those sort first, and the
    // card is marked.

    var hiddenCount = open.length - openSoon.length;

    var moreLine = '';
    if (hiddenCount > 0 && !showAll) {
      moreLine = '<div class="moreline"><button data-action="showall">'
        + 'Show ' + hiddenCount + ' more, further ahead</button></div>';
    } else if (showAll && withinHorizon.length < open.length) {
      // Only offer to fold it back up if doing so would actually hide
      // something. With a handful of needs the two views are the same,
      // and a button that changes nothing is worse than no button.
      moreLine = '<div class="moreline"><button data-action="showall">'
        + 'Show just the next two weeks</button></div>';
    }

    // How many of the things they can act on are new. Counting the whole
    // list would include things already covered, which is not news they
    // can do anything with.
    var newOpen = newIds ? open.filter(function(n){ return newIds[n.id]; }).length : 0;
    var newBar = newOpen
      ? '<div class="newbar">' + newOpen
        + (newOpen === 1 ? ' new thing' : ' new things')
        + ' since you were last here.</div>'
      : '';

    content.innerHTML = banner
      + (showHelp ? helpPanel() : '')
      + addHomeCard()
      + newBar
      + '<div class="me"><span>Signed in as <strong>'+esc(me.name)+'</strong> \u00b7 '+esc(me.email)+'</span>'
      + '<button class="btn link" data-action="editme">Change</button></div>'
      + journeyButton()
      + yoursBox()
      + togetherLine()
      + '<div class="chips">'+chips+'</div>'
      + '<div class="section-title">Open needs</div>'
      + '<div class="section-sub">'+(openSoon.length ? 'One tap signs you up \u2014 the invitation goes to your email.' : '')+'</div>'
      + (openSoon.length ? openSoon.map(row).join('')
          : '<div class="empty">Everything\u2019s covered right now. Check back soon, or see what\u2019s already handled below.</div>')
      + moreLine
      + '<div class="section-title">Already covered</div>'
      + (cov.length ? cov.map(row).join('') : '<div class="empty">Nothing covered yet.</div>')
      // Quiet, at the bottom, competing with nothing. Someone who needs
      // it will be looking for it.
      + '<div class="footline"><button data-action="problem">'
      +   'Something not working?</button></div>';
  }

  // Added to a home screen, iOS keeps the page frozen in memory rather
  // than reloading it. Someone reopening the app days later would see
  // whatever was on screen when they last closed it — a list that may
  // be entirely out of date.
  //
  // Claiming is guarded at the database, so stale data cannot actually
  // double-book anything. But being shown an old list and then told no
  // is a poor way to find out.
  async function refreshIfStale() {
    if (document.visibilityState !== 'visible') return;
    // A quick switch to another app and back does not need a round trip.
    if (Date.now() - lastLoaded < 45000) return;
    // Nor should the list move while a question is on screen.
    if (document.querySelector('.ask-bg')) return;
    if (!me) return;
    lastLoaded = Date.now();
    try {
      if (coord) { await loadCoord(); } else { await loadNeeds(); }
    } catch (e) { /* offline: leave what is on screen */ }
  }

  // Between them these cover every way a page comes back:
  //   visibilitychange  app switcher, tab switch, screen unlock (iOS + Android)
  //   pageshow          restored from cache rather than loaded
  //   focus             window refocused on a laptop
  //   resume            older Android webviews
  document.addEventListener('visibilitychange', refreshIfStale);
  window.addEventListener('pageshow', function (e) {
    // persisted means it came back from the cache rather than loading.
    if (e.persisted) { lastLoaded = 0; refreshIfStale(); }
  });
  window.addEventListener('focus', refreshIfStale);
  document.addEventListener('resume', refreshIfStale);

  // A tab left open and watched — someone who opens this in the morning
  // and glances back after lunch — never fires any of the events above.
  // A quiet check every three minutes keeps that honest.
  //
  // Skipped while a dialog is open, so the page cannot rearrange itself
  // underneath someone who is part way through answering a question.
  setInterval(function () {
    if (document.visibilityState !== 'visible') return;
    if (document.querySelector('.ask-bg')) return;
    refreshIfStale();
  }, 180000);

  // Android fires this when the browser would have offered installation.
  // Holding on to it lets the card trigger the real dialog. Safari never
  // fires it, which is why the card falls back to instructions.
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    installEvt = e;
    render();
  });

  window.addEventListener('appinstalled', function () {
    hideAdd = true;
    render();
  });

  try { hideAdd = localStorage.getItem('tracey_hide_add') === '1'; } catch (e) {}

  var helpBtn = document.getElementById('helpbtn');
  helpBtn.addEventListener('click', function(){
    showHelp = !showHelp;
    helpBtn.className = 'modetoggle' + (showHelp ? ' on' : '');
    helpBtn.textContent = showHelp ? 'Close help' : 'Help';
    render();
    window.scrollTo(0, 0);
  });

  modeBtn.addEventListener('click', function(){
    coord = !coord; notice = '';
    if (coord && !coordData) render(); else if (!coord) render(); else loadCoord();
  });

  document.getElementById('root').addEventListener('click', async function(e){
    var el = e.target.closest('[data-action]'); if (!el) return;
    var a = el.getAttribute('data-action'), id = el.getAttribute('data-id');

    if (a === 'copy') {
      var t = el.getAttribute('data-copy');
      try { el.select && el.select(); } catch(x){}
      if (navigator.clipboard) navigator.clipboard.writeText(t).then(function(){
        copiedKey = el.getAttribute('data-key'); render(); }).catch(function(){});
      return;
    }
    if (a === 'filter') { cat = el.getAttribute('data-cat'); render(); return; }
    if (a === 'editme') { me = null; lsSet('tracey_me', null); render(); return; }

    if (a === 'unlock') {
      pass = (document.getElementById('c-pass').value || '').trim();
      if (!pass) return;
      await loadCoord(); return;
    }

    if (a === 'register') {
      var fEl = document.getElementById('r-first');
      var lEl = document.getElementById('r-last');
      var eEl = document.getElementById('r-email');
      var err = document.getElementById('r-err');

      var first = (fEl.value || '').trim();
      var last  = (lEl.value || '').trim();
      var email = (eEl.value || '').trim().toLowerCase();
      var phone = (document.getElementById('r-phone').value || '').trim();

      // Typing a whole name into the first box is a common slip. Move the
      // surplus across rather than making anyone retype.
      if (!last && first.indexOf(' ') > 0) {
        var parts = first.split(/\s+/);
        first = parts.shift();
        last  = parts.join(' ');
        fEl.value = first;
        lEl.value = last;
      }

      function fail(el, slot, msg) {
        document.getElementById(slot).textContent = msg;
        el.classList.add('bad');
      }
      function clearField(el, slot) {
        document.getElementById(slot).textContent = '';
        el.classList.remove('bad');
      }
      clearField(fEl, 'e-first'); clearField(lEl, 'e-last'); clearField(eEl, 'e-email');
      err.style.display = 'none';

      var ok = true;
      if (first.length < 2) { fail(fEl, 'e-first', 'Please give your first name.'); ok = false; }
      if (last.length < 2)  { fail(lEl, 'e-last', 'Last name too, so Tracey knows which friend this is.'); ok = false; }
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
        fail(eEl, 'e-email', 'An email address that can receive calendar invitations.'); ok = false;
      }
      if (!ok) return;

      // Stored as one string, shown in full to friends and coordinators.
      var name = first + ' ' + last;
      var r = await db.rpc('register_volunteer', { p_email: email, p_name: name, p_phone: phone });
      if (r.error) { err.textContent = 'Could not save that just now. Check your connection and try again.'; err.style.display='block'; return; }
      me = { name: name, email: email, phone: phone };
      // Welcome back message if we already knew this address.
      try {
        var known = await db.rpc('find_volunteer', { p_email: email });
        if (known && known.data && known.data.name) { me.name = name || known.data.name; }
      } catch (e) {}
      lsSet('tracey_me', me);
      await loadNeeds(); return;
    }

    if (a === 'claim') {
      if (!me || busy) return;
      busy = id; render();
      var r = await db.rpc('claim_need', { p_id: id, p_email: me.email, p_name: me.name });
      busy = null;
      if (r.error) { notice = 'Could not sign you up just now. Please try again.'; }
      else if (r.data === true) {
        notice = '';
        notify(id, 'claimed');

        // They have engaged with the list, so the markers have done
        // their job. Cleared on screen as well as in the database —
        // otherwise the thing they just claimed keeps announcing itself
        // as new until the page is reloaded.
        try { db.rpc('mark_seen', { p_email: me.email, p_what: 'needs' }); } catch (e) {}
        newIds = {};

        // The moment they have said yes to one leg is the moment they
        // are thinking about the day. Asking now catches most of the
        // cases where a return trip would otherwise be left open.
        var claimedNeed = needs.filter(function(x){ return x.id === id; })[0];
        if (claimedNeed && claimedNeed.partner_id && claimedNeed.partner_status === 'OPEN') {
          var otherWord = claimedNeed.leg === 'out' ? 'ride home' : 'ride there';
          var takeBoth = await askYesNo(
            'Can you do the ' + otherWord + ' too?',
            'It is at ' + (claimedNeed.partner_time || '')
              + ', and nobody has taken it yet. Without it she has no way '
              + (claimedNeed.leg === 'out' ? 'home' : 'there') + '.',
            'Yes, I will do both',
            'No, just the one');

          if (takeBoth) {
            var pr = await db.rpc('claim_need', {
              p_id: claimedNeed.partner_id, p_email: me.email, p_name: me.name
            });
            if (!pr.error && pr.data === true) {
              notify(claimedNeed.partner_id, 'claimed');
            } else {
              notice = 'Someone else took the ' + otherWord + ' just then.';
            }
          }
        }

        // Signing up for the first time also asks to read her updates,
        // so nobody has to think of requesting it.
        if (access && access.access === 'none' && !access.requested) {
          try {
            var jr2 = await db.rpc('request_access', { p_email: me.email });
            if (!jr2.error) {
              access = { access: 'none', requested: true };
              if (jr2.data && jr2.data.new) notifyAccess(me.email, me.name);
            }
          } catch (e) {}
        }
      }
      else { notice = 'Someone else just took that one. Here is the updated list.'; }
      await loadNeeds(); return;
    }

    if (a === 'release') {
      var thisNeed = needs.filter(function(x){ return x.id === id; })[0];
      var alsoHavePartner = thisNeed && thisNeed.partner_id
        && thisNeed.partner_is_mine === true;

      var sure = await askYesNo(
        'Free up this slot?',
        'It goes back on the list for someone else, and Tracey is told.',
        'Yes, free it up',
        'No, keep it');
      if (!sure) return;

      var rr = await db.rpc('release_need', { p_id: id, p_email: me.email });
      if (rr.error || rr.data !== true) {
        notice = 'Could not release that. Please refresh and try again.';
        await loadNeeds(); return;
      }
      notice = '';
      notify(id, 'released');

      // Someone who cannot make the appointment usually cannot do either
      // journey. Asking mirrors the question on the way in.
      if (alsoHavePartner) {
        var otherLeg = thisNeed.leg === 'out' ? 'ride home' : 'ride there';
        var alsoDrop = await askYesNo(
          'You also have the ' + otherLeg,
          'Would you like to free that up as well? If you keep it, she will '
            + 'still need someone for the '
            + (thisNeed.leg === 'out' ? 'journey there' : 'journey home') + '.',
          'Yes, free up both',
          'No, I can still do that one');

        if (alsoDrop) {
          var pr2 = await db.rpc('release_need', {
            p_id: thisNeed.partner_id, p_email: me.email
          });
          if (!pr2.error && pr2.data === true) {
            notify(thisNeed.partner_id, 'released');
          } else {
            notice = 'Freed this one, but could not free the ' + otherLeg + '.';
          }
        }
      }

      await loadNeeds(); return;
    }

    if (a === 'hideadd') {
      e.stopPropagation();
      hideAdd = true;
      try { localStorage.setItem('tracey_hide_add', '1'); } catch (err) {}
      render();
      return;
    }

    if (a === 'addhome') {
      // Android: the browser will show its own dialog.
      if (installEvt) {
        installEvt.prompt();
        try {
          var choice = await installEvt.userChoice;
          if (choice && choice.outcome === 'accepted') hideAdd = true;
        } catch (err) {}
        installEvt = null;
        render();
        return;
      }

      // iPhone and iPad: there is no dialog to ask for. Show where the
      // option actually lives, since almost nobody has found it.
      await showHowTo();
      return;
    }

    if (a === 'journey-ask') {
      var wants = await askYesNo(
        'Ask to read Tracey\u2019s journey?',
        'She writes about how her recovery is going. '
          + APPROVER + ' decides who can read it.',
        'Yes, ask for me',
        'Not now');
      if (!wants) return;
      var jr = await db.rpc('request_access', { p_email: me.email });
      if (jr.error) { notice = 'Could not send that just now. Please try again.'; render(); return; }
      access = { access: 'none', requested: true };
      if (jr.data && jr.data.new) notifyAccess(me.email, me.name);
      window.alert('Asked. ' + APPROVER + ' will let you in shortly.');
      render();
      return;
    }

    if (a === 'journey-pending') {
      window.alert('Your request is with ' + APPROVER + '. You will be able to read her updates once it is approved.');
      return;
    }

    if (a === 'journal') {
      window.location.href = '/journal';
      return;
    }

    if (a === 'problem') {
      await reportProblem();
      return;
    }

    if (a === 'showmine') {
      showMine = !showMine;
      render();
      return;
    }

    if (a === 'showall') {
      showAll = !showAll;
      render();
      return;
    }

    if (a === 'toggreq') {
      showReq = !showReq;
      render();
      return;
    }

    if (a === 'postreq') {
      var t = (document.getElementById('rq-title').value || '').trim();
      var note = (document.getElementById('rq-note').value || '').trim();
      var by = (document.getElementById('rq-by').value || '').trim();
      var errSlot = document.getElementById('rq-err');
      errSlot.textContent = '';

      if (t.length < 3) {
        errSlot.textContent = 'A few words about what is needed.';
        return;
      }

      el.disabled = true;
      el.textContent = 'Posting…';
      var qr = await db.rpc('add_request', {
        p_title: t, p_pass: pass, p_category: 'other',
        p_by_when: by || null, p_instructions: note,
        p_window: (document.getElementById('rq-when').value || '').trim()
      });
      el.disabled = false;
      el.textContent = 'Put it on the list';

      if (qr.error || !qr.data || qr.data.ok !== true) {
        errSlot.textContent = (qr.data && qr.data.reason)
          ? qr.data.reason : 'Could not post that. Please try again.';
        return;
      }
      showReq = false;
      notice = 'Added. Friends will see it as something they can do anytime.';
      await loadCoord();
      return;
    }

    if (a === 'askall') {
      var howMany = (coordData.volunteers || []).length;
      var openNow = (coordData.needs || []).filter(function(n){
        return n.status === 'OPEN' && n.date >= todayStr(); }).length;
      var last = coordData.last_broadcast || '';

      var go = await askYesNo(
        'Email all ' + howMany + (howMany === 1 ? ' friend?' : ' friends?'),
        'Each of them gets a list of the ' + openNow
          + (openNow === 1 ? ' thing' : ' things') + ' still open, with the link. '
          + (last ? 'You last did this ' + agoWords(last) + '. ' : '')
          + 'Nobody sees anyone else\u2019s address.',
        'Yes, ask everyone',
        'Not now');
      if (!go) return;

      el.disabled = true;
      el.textContent = 'Sending\u2026';

      var result = null;
      try {
        var res = await fetch('/api/ask-everyone', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pass: pass })
        });
        result = res.ok ? await res.json() : null;
      } catch (err) { result = null; }

      el.disabled = false;
      el.textContent = 'Ask everyone';

      if (!result) {
        notice = 'Could not send those just now. Please try again.';
      } else if (result.reason) {
        notice = result.reason;
      } else {
        notice = 'Sent to ' + result.sent
          + (result.sent === 1 ? ' friend' : ' friends')
          + (result.failed && result.failed.length
              ? '. Could not reach: ' + result.failed.join(', ') : '.');
      }
      await loadCoord();
      return;
    }

    if (a === 'retry' || a === 'dropfail') {
      var fKind = el.getAttribute('data-kind');
      var fTo = el.getAttribute('data-to') || null;
      var fNeed = el.getAttribute('data-need') || null;

      if (a === 'retry') {
        el.disabled = true;
        el.textContent = 'Sending\u2026';

        // Replay the same message. Which fields matter depends on what
        // it was: a need-shaped message needs the need, a journal link
        // needs the address.
        var body = (fKind === 'journal-link')
          ? { action: 'access-granted', email: fTo, again: true }
          : { id: fNeed, action: fKind === 'invite' ? 'claimed' : fKind };

        var sent = false;
        try {
          var res = await fetch('/api/notify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });
          sent = res.ok;
        } catch (err) { sent = false; }

        el.disabled = false;
        el.textContent = 'Send it again';

        if (!sent) {
          notice = 'Still not going through. The mail service may still be down.';
          render();
          return;
        }
      }

      // Either it went, or you have dealt with it another way. Both mean
      // it should stop asking.
      try {
        await db.rpc('mark_retried', {
          p_pass: pass, p_kind: fKind, p_recipient: fTo, p_need_id: fNeed
        });
      } catch (err) {}

      notice = a === 'retry' ? 'Sent.' : '';
      await loadCoord();
      return;
    }

    if (a === 'setcat') {
      var newCat = el.getAttribute('data-cat');
      el.disabled = true;
      var cr = await db.rpc('set_category', {
        p_pass: pass, p_id: id, p_category: newCat
      });
      el.disabled = false;
      if (cr.error || !cr.data || cr.data.ok !== true) {
        notice = 'Could not change that. Please try again.'; render(); return;
      }
      await loadCoord();
      return;
    }

    if (a === 'togglepast') {
      showPast = !showPast;
      await loadCoord();
      window.scrollTo(0, 0);
      return;
    }

    if (a === 'remove') {
      if (!window.confirm(
        'Remove this need from the page for good?\n\n' +
        'Anyone who signed up will be emailed to say it is cancelled.')) return;

      el.disabled = true;

      // Tell the volunteer before deleting the row, so the function can look
      // the details up itself rather than trusting anything sent from here.
      var told = null;
      var stillOnInvite = false;
      try {
        var cres = await fetch('/api/notify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: id, action: 'cancelled' })
        });
        if (cres.ok) {
          var cdata = await cres.json();
          told = cdata.told;
          stillOnInvite = cdata.was_invited === true;
        }
      } catch (e) { /* removal should not depend on the email */ }

      var rr = await db.rpc('remove_need', { p_pass: pass, p_id: id });
      el.disabled = false;

      if (rr.error || !rr.data || rr.data.ok !== true) {
        notice = 'Could not remove that. Please try again.'; render(); return;
      }

      if (rr.data.was_claimed_by) {
        window.alert(
          told
            ? (rr.data.was_claimed_by + ' has been emailed to say it is cancelled.'
               + (stillOnInvite
                   ? '\n\nThey are also on the Outlook invite \u2014 cancel that '
                     + 'event in Outlook so it leaves their calendar.'
                   : ''))
            : ('Removed, but ' + rr.data.was_claimed_by + ' could not be emailed. '
               + 'Worth telling them directly.'));
      }
      await loadCoord();
      return;
    }

    if (a === 'setvis') {
      var vis = el.getAttribute('data-vis');
      el.disabled = true;
      var vr = await db.rpc('set_post_visibility', { p_pass: pass, p_id: id, p_visibility: vis });
      el.disabled = false;
      if (vr.error || !vr.data || vr.data.ok !== true) {
        notice = 'Could not change that. Please try again.'; render(); return;
      }
      await loadCoord();
      return;
    }

    if (a === 'delpost') {
      if (!window.confirm('Delete this post for good? Hiding it keeps it in case she changes her mind.')) return;
      var dr = await db.rpc('delete_post', { p_pass: pass, p_id: id });
      if (dr.error || !dr.data || dr.data.ok !== true) {
        notice = 'Could not delete that. Please try again.'; render(); return;
      }
      await loadCoord();
      return;
    }

    if (a === 'setaddr') {
      var aEmail = el.getAttribute('data-email');
      var aName = el.getAttribute('data-name') || '';
      var wantKnows = el.getAttribute('data-knows') === '1';

      el.disabled = true;
      var ar2 = await db.rpc('set_address_access', {
        p_pass: pass, p_email: aEmail, p_knows: wantKnows
      });
      el.disabled = false;

      if (ar2.error || !ar2.data || ar2.data.ok !== true) {
        notice = 'Could not change that. Please try again.'; render(); return;
      }

      // Newly told: put it in their inbox rather than leaving them to
      // notice it on a page.
      if (ar2.data.newly_told && ar2.data.address) {
        try {
          await fetch('/api/notify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              action: 'address-shared', email: aEmail,
              name: aName, address: ar2.data.address
            })
          });
          notice = aName + ' has been emailed her address.';
        } catch (err) {
          notice = 'Turned on, but the email did not go. It is in '
            + 'Did not go out.';
        }
      }
      await loadCoord();
      return;
    }

    if (a === 'settier') {
      var em = el.getAttribute('data-email');
      var lvl = el.getAttribute('data-level');

      // What they had before, so a friend already reading is not emailed
      // again just because you moved them between levels.
      var before = (coordData.volunteers || []).filter(function(v){
        return v.email === em; })[0];
      var wasReading = before && (before.access === 'approved' || before.access === 'close');
      var name = before ? before.name : '';

      el.disabled = true;
      var sr = await db.rpc('set_access', { p_pass: pass, p_email: em, p_level: lvl });
      el.disabled = false;
      if (sr.error || !sr.data || sr.data.ok !== true) {
        notice = 'Could not change that. Please try again.'; render(); return;
      }

      // Newly let in: tell them. They asked, and nothing else would.
      if (!wasReading && (lvl === 'approved' || lvl === 'close')) {
        notifyGranted(em, name, false);
      }
      await loadCoord();
      return;
    }

    if (a === 'resend') {
      var rem = el.getAttribute('data-email');
      var rn = el.getAttribute('data-name') || '';
      el.disabled = true;
      el.textContent = 'Sending…';
      var ok = await notifyGranted(rem, rn, true);
      el.disabled = false;
      el.textContent = ok ? 'Sent' : 'Try again';
      setTimeout(function(){ el.textContent = 'Email link'; }, 2500);
      return;
    }

    if (a === 'assign') {
      var nEl = document.getElementById('an-' + id);
      var eEl2 = document.getElementById('ae-' + id);
      var slot = document.getElementById('aerr-' + id);
      var nm = (nEl.value || '').trim();
      var em = (eEl2.value || '').trim().toLowerCase();

      slot.textContent = '';
      if (nm.length < 2) { slot.textContent = 'Their name, so Tracey knows who is coming.'; return; }
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) {
        slot.textContent = 'An email address that can receive the calendar invitation.'; return;
      }

      el.disabled = true;
      el.textContent = 'Signing up\u2026';
      var ar = await db.rpc('assign_need', {
        p_pass: pass, p_id: id, p_name: nm, p_email: em, p_phone: ''
      });
      el.disabled = false;
      el.textContent = 'Sign them up';

      if (ar.error) { slot.textContent = 'Could not do that just now. Try again.'; return; }
      if (!ar.data || ar.data.ok !== true) {
        slot.textContent = (ar.data && ar.data.reason) ? ar.data.reason : 'Could not sign them up.';
        return;
      }
      // Same notification and invitation path a friend's own claim takes.
      notify(id, 'claimed');
      await loadCoord();
      return;
    }

    if (a === 'unassign') {
      if (!window.confirm('Free this up so someone else can take it?')) return;
      var ur = await db.rpc('unassign_need', { p_pass: pass, p_id: id });
      if (ur.error || !ur.data || ur.data.ok !== true) {
        notice = 'Could not free that up. Refresh and try again.';
        render(); return;
      }
      notify(id, 'released');
      if (ur.data.was_invited) {
        window.alert('Freed up. They were already on the Outlook invite \u2014 remember to remove them from the event.');
      }
      await loadCoord();
      return;
    }

    if (a === 'invited') {
      var mi = await db.rpc('mark_invited', { p_id: id, p_pass: pass });
      if (mi.error) { notice = 'Could not update that.'; render(); return; }
      await loadCoord(); return;
    }
  });

  loadNeeds().then(startPoll);

  // ---------- staying current ----------
  //
  // A page open since before a deploy keeps running old code, and no
  // deploy can reach into it. So it asks about itself: a HEAD request
  // to its own address returns an ETag that changes whenever this file
  // changes. Different from the one it started with means the page in
  // front of you is out of date.
  //
  // Asking about this page rather than about the deploy is the right
  // question: a change to a function elsewhere does not require the
  // person reading this to have anything reloaded.
  var myTag = null;
  var needsReload = false;

  async function checkBuild() {
    try {
      var res = await fetch(window.location.pathname, {
        method: 'HEAD', cache: 'no-store'
      });
      if (!res.ok) return;
      var tag = res.headers.get('etag') || res.headers.get('last-modified');
      if (!tag) return;                    // nothing to compare: never fires

      if (myTag === null) { myTag = tag; return; }
      if (tag !== myTag) needsReload = true;
    } catch (e) { /* offline: try again later */ }
  }

  // Reporting that something is not working.
  //
  // The point is permission rather than access: a friend can already
  // text about a problem, and mostly will not — it feels too small to
  // bother someone whose wife is recovering. A button that invites it
  // lowers that bar. So the wording asks what went wrong, not for
  // feedback, which would invite opinions nobody has time to answer.
  function reportProblem() {
    return new Promise(function (resolve) {
      var bg = document.createElement('div');
      bg.className = 'ask-bg';
      bg.innerHTML = '<div class="ask">'
        + '<h3>What went wrong?</h3>'
        + '<p>However small. If something did not do what you expected, '
        + esc(CONTACT) + ' would rather know.</p>'
        + '<textarea id="pr-text" placeholder="I tapped I can help on '
        +   'Thursday\u2019s walk and nothing happened."></textarea>'
        + '<div class="field-err" id="pr-err"></div>'
        + '<div class="acts">'
        +   '<button class="yes" data-send="1">Send it</button>'
        +   '<button data-send="0">Cancel</button>'
        + '</div></div>';

      function done() {
        if (bg.parentNode) bg.parentNode.removeChild(bg);
        document.removeEventListener('keydown', onKey);
        resolve();
      }
      function onKey(e) { if (e.key === 'Escape') done(); }

      bg.addEventListener('click', async function (e) {
        var b = e.target.closest('[data-send]');
        if (!b && e.target !== bg) return;
        if (!b || b.getAttribute('data-send') === '0') { done(); return; }

        var box = document.getElementById('pr-text');
        var said = (box.value || '').trim();
        var slot = document.getElementById('pr-err');
        if (said.length < 5) {
          slot.textContent = 'A sentence about what happened is plenty.';
          return;
        }

        b.disabled = true;
        b.textContent = 'Sending\u2026';

        // Enough about where they were that nobody has to ask which
        // thing they meant.
        var context = [
          coord ? 'coordinator view' : 'friend view',
          (needs || []).length + ' needs loaded',
          cat === 'all' ? 'no filter' : 'filtered to ' + cat,
          showAll ? 'showing everything' : 'two-week view'
        ].join(' \u00b7 ');

        var ok = false;
        try {
          var res = await fetch('/api/notify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              action: 'problem',
              name: me ? me.name : '',
              email: me ? me.email : '',
              said: said,
              context: context
            })
          });
          ok = res.ok;
        } catch (err) { ok = false; }

        b.disabled = false;
        b.textContent = 'Send it';

        if (!ok) {
          slot.textContent = 'Could not send that just now. Please try again.';
          return;
        }
        done();
        window.alert('Thanks \u2014 ' + CONTACT + ' will take a look.');
      });

      document.addEventListener('keydown', onKey);
      document.body.appendChild(bg);
      setTimeout(function(){
        var t = document.getElementById('pr-text');
        if (t) t.focus();
      }, 60);
    });
  }

  function reloadIfDue() {
    if (!needsReload) return;
    if (document.visibilityState !== 'visible') return;
    // Never while a question is on screen or something is being typed.
    if (document.querySelector('.ask-bg')) return;
    var el = document.activeElement;
    if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA')) return;
    window.location.reload();
  }

  checkBuild();
  setInterval(function () {
    if (document.visibilityState !== 'visible') return;
    checkBuild().then(reloadIfDue);
  }, 180000);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') checkBuild().then(reloadIfDue);
  });

})();
</script>
</body>
</html>
