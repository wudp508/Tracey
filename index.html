<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>For Tracey</title>
<meta name="description" content="Pick anything you can take. Everyone sees the same list, so nothing gets doubled up." />

<!-- Link preview. iMessage, WhatsApp, Slack and Facebook read these; the
     absolute URL on og:image matters, relative paths are ignored by most
     of them.

     og:url is deliberately absent. Some scrapers treat it as canonical
     and cache the preview against it, which would defeat adding ?v=2 to
     the link to force a fresh card. Without it, each distinct URL gets
     its own preview. -->
<meta property="og:type" content="website" />
<meta property="og:title" content="For Tracey" />
<meta property="og:description" content="Rides, walks, Izzy and whatever else — take what fits your week. Everyone sees the same list, so nothing gets doubled up." />
<meta property="og:image" content="https://tracey-humphreys-help-her-recover.netlify.app/preview.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:site_name" content="For Tracey" />

<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="For Tracey" />
<meta name="twitter:description" content="Rides, walks, Izzy and whatever else — take what fits your week." />
<meta name="twitter:image" content="https://tracey-humphreys-help-her-recover.netlify.app/preview.png" />

<meta name="theme-color" content="#F7F5F0" />
  <!-- Added to a home screen, this becomes the icon and the label.
       Without them iOS uses a screenshot of the page and the full title. -->
  <link rel="apple-touch-icon" href="/icon-180.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="apple-mobile-web-app-title" content="For Tracey" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#F7F5F0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F5F0; --card-bg:#FFF; --text:#2B2321; --text-muted:#6E6558; --border:#E4DFD3;
    --sage:#6B7F5E; --teal:#3D5A5B; --ochre:#B8863B; --rose:#B5696A; --gold:#C9A227;
    --clay:#A85C32; --slate:#5B7C99; --plum:#7A5C7E; --grey:#8A8578;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;
       -webkit-font-smoothing:antialiased}
  .app{max-width:640px;margin:0 auto;padding:26px 18px 56px}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:1.9rem;margin:0 0 6px;letter-spacing:-.01em}
  .sub{margin:0 0 18px;color:var(--text-muted);font-size:.93rem;line-height:1.5;max-width:46ch}
  .welcome{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;
    padding:16px 18px;margin:0 0 22px;max-width:52ch}
  .welcome p{margin:0 0 11px;font-size:.93rem;line-height:1.6;color:var(--text)}
  .welcome p:last-child{margin-bottom:0;color:var(--text-muted)}
  .modetoggle{flex:0 0 auto;font-size:.76rem;font-weight:600;border:1px solid var(--border);
    background:var(--card-bg);color:var(--text-muted);border-radius:100px;padding:6px 12px;
    cursor:pointer;font-family:inherit}
  .modetoggle.on{background:var(--text);color:#fff;border-color:var(--text)}
  .me{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card-bg);
    border:1px solid var(--border);border-radius:9px;padding:10px 12px;margin-bottom:18px;font-size:.85rem}
  .me span{color:var(--text-muted)} .me strong{color:var(--text);font-weight:600}
  .gate{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:18px}
  .gate h2{font-family:'Fraunces',serif;font-size:1.2rem;font-weight:500;margin:0 0 6px}
  .gate p{color:var(--text-muted);font-size:.88rem;line-height:1.5;margin:0 0 14px}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:20px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--border);background:var(--card-bg);color:var(--text);
    font-family:inherit;font-size:.81rem;font-weight:500;padding:7px 13px;border-radius:100px;
    cursor:pointer;white-space:nowrap}
  .chip.active{background:var(--text);border-color:var(--text);color:#fff}
  .chip .n{display:inline-block;margin-left:5px;font-size:.72rem;font-weight:700;
    color:var(--text-muted);background:#EFEDE6;border-radius:100px;
    padding:1px 6px;vertical-align:1px}
  .chip.active .n{background:rgba(255,255,255,.22);color:#fff}
  /* Nothing open in that category: still shown, so a friend can see it
     exists, but visibly not worth a tap. */
  .chip.bare{opacity:.45}
  .section-title{font-family:'Fraunces',serif;font-size:1.12rem;font-weight:500;margin:28px 0 4px}
  .section-sub{color:var(--text-muted);font-size:.84rem;margin:0 0 12px;line-height:1.45}
  .empty{color:var(--text-muted);font-size:.89rem;padding:14px 0;border-top:1px solid var(--border)}
  .row{display:flex;gap:13px;padding:16px 2px 16px 14px;border-top:1px solid var(--border);position:relative}
  .row::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:2px;
    background:var(--cat-color,var(--grey))}
  .row.filled{opacity:.88} .row.mine::before{width:6px}
  .when{flex:0 0 84px;font-family:'Fraunces',serif;font-size:.9rem;line-height:1.35;padding-top:1px}
  .when .time{display:block;color:var(--text-muted);font-family:'Inter',sans-serif;font-size:.76rem;margin-top:2px}
  .bd{flex:1;min-width:0}
  .ttl{font-weight:600;font-size:.97rem;margin:0 0 3px}
  .loc{color:var(--text-muted);font-size:.83rem;margin:0 0 6px}
  .pair{font-size:.79rem;font-weight:600;color:var(--clay);margin:0 0 7px;
    display:flex;align-items:center;gap:5px}
  .pair.done{color:var(--sage)}
  .row.orphan{border-color:var(--clay);box-shadow:0 0 0 1px var(--clay)}
  .pair.urgent{color:var(--clay);font-weight:700}
  .addhome{display:flex;align-items:center;gap:11px;background:var(--card-bg);
    border:1px solid var(--border);border-radius:11px;padding:11px 13px;margin:0 0 16px;
    cursor:pointer;font-family:inherit;text-align:left;width:100%}
  .addhome .ic{flex:0 0 auto;width:34px;height:34px;border-radius:9px;
    background:#EDF1F0;display:flex;align-items:center;justify-content:center}
  .addhome .ic svg{width:18px;height:18px}
  .addhome .tx{flex:1;min-width:0}
  .addhome strong{display:block;font-size:.87rem;font-weight:600;color:var(--text)}
  .addhome span{font-size:.79rem;color:var(--text-muted);line-height:1.4}
  .addhome .x{flex:0 0 auto;font-size:1.1rem;color:var(--text-muted);
    padding:2px 6px;background:none;border:none;cursor:pointer;font-family:inherit}
  .howto{font-size:.88rem;line-height:1.6;color:var(--text-muted)}
  .howto ol{margin:0;padding-left:20px}
  .howto li{margin-bottom:8px}
  .howto strong{color:var(--text)}
  .newtag{display:inline-block;font-size:.66rem;font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;color:#fff;background:var(--clay);border-radius:100px;
    padding:2px 7px;margin-left:7px;vertical-align:middle}
  .journey-line{font-size:.83rem;color:var(--text-muted);line-height:1.5;
    margin:0 0 10px}
  .journey-line .to{color:var(--text-muted);margin:0 5px}
  /* A pill rather than tinted text. The same shape as the Details
     toggle on these cards, because it does the same kind of job: an
     obvious thing to tap. Underlined teal read as prose. */
  .journey-line a{display:inline-block;color:var(--teal);text-decoration:none;
    font-size:.72rem;font-weight:700;white-space:nowrap;margin-left:6px;
    background:#EDF1F0;border:1px solid #D8E2E0;border-radius:100px;
    padding:3px 10px;vertical-align:1px;
    -webkit-tap-highlight-color:transparent}
  .journey-line a:active{background:#E2E9E7}
  .journey-line a::before{content:'↗';margin-right:4px;font-weight:400}
  .journey-line strong{font-weight:600;color:var(--text)}
  .row.mine .journey-line strong{color:var(--sage)}
  .anytime-chip{display:inline-block;font-size:.68rem;font-weight:700;
    letter-spacing:.05em;text-transform:uppercase;color:var(--teal);
    background:#EDF1F0;border-radius:100px;padding:2px 8px;margin-right:6px;
    vertical-align:middle}
  .reqform{background:var(--card-bg);border:1px solid var(--border);
    border-radius:11px;padding:14px;margin:0 0 18px}
  .reqform input,.reqform textarea{width:100%;font-family:inherit;
    font-size:16px;padding:10px 12px;border:1px solid var(--border);
    border-radius:8px;margin-bottom:8px;background:#fff;color:var(--text)}
  .reqform textarea{min-height:60px;resize:vertical}
  .reqform label{display:block;font-size:.78rem;font-weight:600;
    color:var(--text-muted);margin:2px 0 4px}
  .askbar{display:flex;justify-content:space-between;align-items:center;gap:10px;
    background:var(--card-bg);border:1px solid var(--border);border-radius:9px;
    padding:10px 13px;margin:0 0 18px;font-size:.83rem;color:var(--text-muted)}
  .askbar button{font-size:.78rem;font-weight:600;padding:7px 13px;border-radius:7px;
    border:1px solid var(--sage);background:var(--sage);color:#fff;
    cursor:pointer;font-family:inherit;flex:0 0 auto}
  .askbar button:disabled{opacity:.55}
  .newbar{background:#FBF3EE;border:1px solid #E8D3C4;border-radius:9px;
    padding:10px 13px;margin:0 0 16px;font-size:.86rem;font-weight:600;
    color:var(--clay);line-height:1.45}
  .journey .count{display:inline-block;font-size:.68rem;font-weight:700;color:#fff;
    background:var(--clay);border-radius:100px;padding:2px 7px;margin-left:7px;
    vertical-align:middle;letter-spacing:.03em}
  .ask-bg{position:fixed;inset:0;background:rgba(43,35,33,.45);z-index:90;
    display:flex;align-items:center;justify-content:center;padding:22px}
  .ask{background:var(--card-bg);border-radius:14px;padding:22px 20px 18px;
    max-width:380px;width:100%;box-shadow:0 12px 40px rgba(43,35,33,.22)}
  .ask h3{font-family:'Fraunces',serif;font-size:1.15rem;font-weight:600;
    margin:0 0 9px;line-height:1.3}
  .ask p{margin:0 0 18px;font-size:.9rem;line-height:1.55;color:var(--text-muted)}
  .ask .acts{display:flex;flex-direction:column;gap:8px}
  .ask button{font-family:inherit;font-size:.9rem;font-weight:600;border-radius:9px;
    padding:12px 16px;cursor:pointer;border:1px solid var(--border);
    background:var(--card-bg);color:var(--text)}
  .ask button.yes{background:var(--sage);border-color:var(--sage);color:#fff}
  .instr{margin:0 0 10px}
  .instr summary{cursor:pointer;list-style:none;font-size:.78rem;font-weight:600;
    color:var(--teal);background:#EDF1F0;border:1px solid #D8E2E0;border-radius:100px;
    padding:4px 11px;display:inline-flex;align-items:center;gap:5px;
    -webkit-tap-highlight-color:transparent}
  .instr summary:active{background:#E2E9E7}
  .row.mine .instr summary{color:var(--sage);background:#EFF2EC;border-color:#DDE4D6}
  .instr summary::-webkit-details-marker{display:none}
  .instr summary::after{content:'›';display:inline-block;transition:transform .15s;
    font-size:1rem;line-height:1}
  .instr[open] summary::after{transform:rotate(90deg)}
  .instr .text{color:var(--text-muted);font-size:.83rem;line-height:1.5;
    margin:5px 0 0;white-space:pre-wrap}
  .row.mine .instr .text{color:var(--text);background:#FBF9F4;
    border-left:2px solid var(--sage);padding:8px 10px;border-radius:0 5px 5px 0}
  .btn{font-family:inherit;font-size:.83rem;font-weight:600;border:none;border-radius:7px;
    padding:9px 15px;cursor:pointer}
  .btn.primary{background:var(--text);color:#fff}
  .btn.primary[disabled]{opacity:.5;cursor:default}
  .btn.ghost{background:transparent;color:var(--text-muted);padding-left:0;text-decoration:underline}
  .btn.small{font-size:.78rem;padding:6px 11px}
  .btn.link{background:transparent;color:var(--text-muted);font-size:.78rem;padding:4px 0;
    text-decoration:underline;font-weight:500}
  .vol{font-size:.85rem;margin:0 0 4px} .vol strong{font-weight:600}
  .yours{display:inline-block;font-size:.71rem;font-weight:600;color:var(--sage);border:1px solid var(--sage);
    border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:1px}
  input{width:100%;font-family:inherit;font-size:.92rem;padding:10px;border:1px solid var(--border);
    border-radius:6px;margin-bottom:9px;background:var(--bg);color:var(--text)}
  .hint{color:var(--text-muted);font-size:.76rem;margin:-4px 0 10px;line-height:1.4}
  label{display:block;font-size:.78rem;font-weight:600;color:var(--text);margin:2px 0 5px}
  .req{font-weight:500;color:var(--rose);font-size:.72rem;margin-left:4px}
  .opt{font-weight:500;color:var(--text-muted);font-size:.72rem;margin-left:4px}
  .field-row{display:flex;gap:10px}
  .field-half{flex:1;min-width:0}
  .field-err{color:var(--rose);font-size:.74rem;margin:-5px 0 8px;line-height:1.35}
  input.bad{border-color:var(--rose)}
  .assign{border:1px solid var(--border);background:var(--card-bg);border-radius:10px;
    padding:13px;margin-bottom:11px}
  .assign h4{margin:0 0 2px;font-size:.94rem;font-weight:600}
  .assign .ameta{color:var(--text-muted);font-size:.81rem;margin:0 0 9px;line-height:1.45}
  .assign input{font-size:.87rem;padding:8px 10px;margin-bottom:7px}
  .arow{display:flex;gap:8px}
  .arow input{flex:1;min-width:0}
  .journey{display:block;width:100%;text-align:left;background:var(--card-bg);
    border:1px solid var(--border);border-radius:10px;padding:13px 15px;
    margin:0 0 20px;cursor:pointer;font-family:inherit}
  .journey strong{display:block;font-size:.95rem;font-weight:600;color:var(--text);margin-bottom:3px}
  .journey span{font-size:.83rem;color:var(--text-muted);line-height:1.45}
  .tierrow{display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:11px 0;border-top:1px solid var(--border)}
  .tierrow .who{min-width:0}
  .tierrow .who strong{font-weight:600;font-size:.88rem}
  .tierrow .em{color:var(--text-muted);font-size:.79rem}
  .tierbtns{display:flex;gap:6px;flex:0 0 auto}
  .tierbtns button{font-size:.75rem;font-weight:600;padding:6px 10px;border-radius:6px;
    border:1px solid var(--border);background:var(--card-bg);color:var(--text-muted);
    cursor:pointer;font-family:inherit}
  .tierbtns button.on{background:var(--text);border-color:var(--text);color:#fff}
  .postrow{border:1px solid var(--border);background:var(--card-bg);border-radius:10px;
    padding:13px;margin-bottom:10px}
  .postrow h4{margin:0 0 2px;font-size:.94rem;font-weight:600}
  .postrow .pmeta{color:var(--text-muted);font-size:.79rem;margin:0 0 9px}
  .postrow .excerpt{color:var(--text-muted);font-size:.84rem;line-height:1.5;margin:0 0 11px}
  .postbtns{display:flex;gap:6px;flex-wrap:wrap}
  .postbtns button{font-size:.75rem;font-weight:600;padding:6px 10px;border-radius:6px;
    border:1px solid var(--border);background:var(--card-bg);color:var(--text-muted);
    cursor:pointer;font-family:inherit}
  .postbtns button.on{background:var(--text);border-color:var(--text);color:#fff}
  .postbtns button.danger{color:var(--rose);border-color:var(--rose)}
  .catrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:8px 0 2px}
  .catrow .lbl{font-size:.76rem;color:var(--text-muted);margin-right:2px}
  .catrow button{font-size:.74rem;font-weight:600;padding:5px 10px;border-radius:6px;
    border:1px solid var(--border);background:var(--card-bg);color:var(--text-muted);
    cursor:pointer;font-family:inherit}
  .catrow button.on{background:var(--text);border-color:var(--text);color:#fff}
  .failrow{border:1px solid var(--rose);background:#FDF6F5;border-radius:10px;
    padding:12px 14px;margin-bottom:9px}
  .failrow h4{margin:0 0 3px;font-size:.9rem;font-weight:600;color:var(--text)}
  .failrow .fmeta{font-size:.79rem;color:var(--text-muted);line-height:1.5;margin:0 0 9px}
  .failrow .why{font-family:ui-monospace,monospace;font-size:.72rem;color:var(--rose);
    word-break:break-word;display:block;margin-top:3px}
  .topbtns{display:flex;gap:7px;flex:0 0 auto}
  .pastbar{display:flex;justify-content:space-between;align-items:center;gap:10px;
    background:var(--card-bg);border:1px solid var(--border);border-radius:9px;
    padding:9px 12px;margin:0 0 18px;font-size:.83rem;color:var(--text-muted)}
  .pastbar button{font-size:.78rem;font-weight:600;padding:6px 12px;border-radius:6px;
    border:1px solid var(--border);background:var(--card-bg);color:var(--text);
    cursor:pointer;font-family:inherit;flex:0 0 auto}
  /* A card this friend has taken. It already had a green edge; at the
     top of the page under "You are covering" it should also be plainly
     the thing they came back to look at. */
  .row.mine{border-color:var(--sage);box-shadow:0 0 0 1px var(--sage)}
  .together{font-size:.85rem;color:var(--text-muted);line-height:1.5;
    margin:0 0 20px;padding:0 2px}
  .footline{text-align:center;padding:30px 0 6px;border-top:1px solid var(--border);
    margin-top:26px}
  .footline button{font-family:inherit;font-size:.82rem;font-weight:500;
    background:transparent;border:none;color:var(--text-muted);
    cursor:pointer;padding:8px;-webkit-tap-highlight-color:transparent}
  .footline button:active{color:var(--text)}
  .ask textarea{width:100%;font-family:inherit;font-size:16px;padding:11px 13px;
    border:1px solid var(--border);border-radius:8px;background:#fff;
    color:var(--text);min-height:110px;resize:vertical;margin-bottom:4px}
  .moreline{text-align:center;padding:18px 0 6px}
  .moreline button{font-family:inherit;font-size:.86rem;font-weight:600;
    background:var(--card-bg);border:1px solid var(--border);
    color:var(--teal);border-radius:100px;cursor:pointer;
    padding:11px 22px;-webkit-tap-highlight-color:transparent}
  .moreline button:active{background:#EDF1F0}
  .help{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;
    padding:6px 16px 10px;margin:0 0 22px}
  .help details{border-bottom:1px solid var(--border)}
  .help details:last-of-type{border-bottom:none}
  .help summary{cursor:pointer;list-style:none;padding:13px 0;font-size:.92rem;
    font-weight:600;color:var(--text);display:flex;justify-content:space-between;
    align-items:center;gap:10px}
  .help summary::-webkit-details-marker{display:none}
  .help summary::after{content:'+';color:var(--text-muted);font-weight:400;font-size:1.1rem}
  .help details[open] summary::after{content:'–'}
  .help p{margin:0 0 12px;font-size:.89rem;line-height:1.6;color:var(--text-muted)}
  .help p:last-child{margin-bottom:14px}
  .help h3{font-family:'Fraunces',serif;font-size:1.05rem;font-weight:500;
    margin:16px 0 2px;color:var(--text)}
  .err{color:var(--rose);font-size:.79rem;margin:-2px 0 9px;line-height:1.4}
  .invite{border:1px solid var(--border);background:var(--card-bg);border-radius:10px;padding:14px;margin-bottom:12px}
  .invite h4{margin:0 0 2px;font-size:.95rem;font-weight:600}
  .invite .meta{color:var(--text-muted);font-size:.82rem;margin:0 0 10px}
  .field{margin-bottom:10px}
  .field label{display:block;font-size:.75rem;font-weight:600;color:var(--text-muted);margin-bottom:4px}
  .field textarea,.field .copyline{width:100%;font-family:inherit;font-size:.84rem;padding:8px 10px;
    border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);line-height:1.5}
  .field textarea{min-height:88px;resize:vertical}
  .copied{color:var(--sage);font-size:.76rem;font-weight:600;margin-left:8px}
  .person{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--border);font-size:.86rem}
  .person .em{color:var(--text-muted);font-size:.8rem}
  .status{color:var(--text-muted);font-size:.88rem;padding:20px 0}
  .banner{background:var(--card-bg);border:1px solid var(--rose);color:var(--rose);border-radius:8px;
    padding:10px 12px;font-size:.84rem;margin-bottom:14px;line-height:1.45}
</style>
</head>
<body>
<div class="app" id="root">
  <div class="topbar">
    <div><h1 id="h1">For Tracey</h1><p class="sub" id="sub"></p></div>
    <div class="topbtns">
      <button class="modetoggle" id="helpbtn">Help</button>
      <button class="modetoggle" id="mode">Coordinator</button>
    </div>
  </div>
  <div id="content" class="status">Loading…</div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function () {
  var cfg = window.TRACEY_CONFIG || {};
  var content = document.getElementById('content');
  var modeBtn = document.getElementById('mode');
  var h1 = document.getElementById('h1'), sub = document.getElementById('sub');

  if (!cfg.SUPABASE_URL || cfg.SUPABASE_URL.indexOf('YOUR-PROJECT') !== -1) {
    content.innerHTML = '<div class="banner">config.js still has placeholder values. Add your Supabase project URL and anon key, then reload.</div>';
    modeBtn.style.display = 'none';
    return;
  }
  var db = supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);

  // Who decides on journal access. Set in config.js. All the wording
  // below avoids he/she, so any name reads correctly.
  var APPROVER = (cfg.APPROVER || 'the coordinator');
  // Who to tell when something is wrong. Deliberately separate: Tracey
  // decides who reads her journal, but she should not be the person a
  // dozen friends message about a mistyped time.
  var CONTACT = (cfg.CONTACT || cfg.APPROVER || 'the coordinator');

  var CATS = [
    {key:'rides',   label:'Rides',    color:'var(--sage)'},
    {key:'izzy',    label:'Izzy',     color:'var(--clay)'},
    {key:'walks',   label:'Walks',    color:'var(--ochre)'},
    {key:'other',   label:'Other',    color:'var(--grey)'}
  ];
  var catBy = {}; CATS.forEach(function(c){ catBy[c.key] = c; });
  // Errands folded into Other. Anything still carrying the old key is
  // shown as Other rather than rendering blank.
  catBy['errands'] = catBy['other'];

  var needs = [], coordData = null, me = null, cat = 'all';
  var access = null;   // {access:'none'|'approved'|'close', requested:bool}
  var homeAddr = null; // her street address, only if this friend may have it
  var posts = null;    // Tracey's journal, coordinator view only
  var fails = [];      // emails that did not go out
  var showHelp = false;
  var showPast = false;   // coordinator view: include finished needs
  var showReq = false;    // the ask-for-something form
  var showAll = false;    // friend view: beyond the next fortnight
  var showMine = false;   // all of their own claims, not just the next two
  var newIds = null;      // ids that were new on arrival, held for the visit
  var installEvt = null;  // Android only; iOS never fires this
  var hideAdd = false;
  var lastLoaded = 0;     // when the list was last fetched
  var coord = false, pass = '', copiedKey = null, notice = '', busy = null, poll = null;

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  // An untimed request has no date. Every caller used to assume one,
  // and a missing date produced "Invalid Date" on the card.
  function fmtD(iso){
    if (!iso) return 'Anytime';
    return new Date(iso+'T00:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
  }
  function fmtL(iso){
    if (!iso) return 'anytime';
    return new Date(iso+'T00:00:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
  }
  function first(n){ return String(n||'').split(' ')[0]; }

  function lsGet(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } }
  function lsSet(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
  me = lsGet('tracey_me');

  async function loadNeeds(){
    lastLoaded = Date.now();
    // Whether this person can read Tracey's journal, and whether they
    // have already asked. Failure here must never block the needs list.
    if (me) {
      try {
        var ar = await db.rpc('my_access', { p_email: me.email });
        if (!ar.error && ar.data) access = ar.data;
      } catch (e) {}

      // Her address, if this friend is allowed it. Fetched once and used
      // only to build Directions links — it never appears as text.
      try {
        var hr = await db.rpc('home_directions', { p_email: me.email });
        homeAddr = (!hr.error && hr.data) ? hr.data.address : null;
      } catch (e) { homeAddr = null; }
    }
    var r = await db.rpc('list_needs', { p_email: me ? me.email : null });

    // Marking a need as new is only useful if the marker lasts. Capture
    // them once on arrival and reuse that set, so claiming something
    // does not quietly wipe the others.
    if (newIds === null && !r.error && me) {
      newIds = {};

      // Only flag what a friend can actually see and act on: still open,
      // and inside the fortnight the list already shows. Without this a
      // re-sent daily series would arrive as thirty new things at once
      // and turn the whole page orange.
      var far = new Date(); far.setDate(far.getDate() + 14);
      var farStr = far.toISOString().slice(0, 10);

      (r.data || []).forEach(function(n){
        if (!n.is_new || n.status !== 'OPEN') return;
        // The database already keeps repeating occurrences to a week;
        // one-offs are held to the two weeks the list shows.
        if (n.date <= farStr) newIds[n.id] = true;
      });
      // Nothing is marked seen just for loading the page. A friend who
      // opens it, reads, and closes it without signing up for anything
      // should find the same markers next time — they have not dealt
      // with any of it yet. The markers clear when they claim something,
      // or age out on their own.
    }
    if (r.error) { notice = 'Could not reach the schedule. Check your connection and reload.'; }
    else { needs = r.data || []; notice = ''; }
    render();
  }

  async function loadCoord(){
    // Posts are a separate call so a journal problem cannot stop the
    // rest of the coordinator view loading.
    try {
      var pr = await db.rpc('coordinator_posts', { p_pass: pass });
      posts = pr.error ? [] : (pr.data || []);
    } catch (e) { posts = []; }

    // Anything that was meant to be emailed and was not.
    try {
      var fr = await db.rpc('failed_sends', { p_pass: pass });
      fails = fr.error ? [] : (fr.data || []);
    } catch (e) { fails = []; }

    var r = await db.rpc('coordinator_data', { p_pass: pass, p_past: showPast });

    if (r.error) {
      // Tracey has her own passphrase and her own page. Rather than make
      // her remember a second address, the same box recognises hers and
      // sends her there.
      try {
        var t = await db.rpc('tracey_view', { p_pass: pass });
        if (!t.error) {
          try { sessionStorage.setItem('tracey_pass', pass); } catch (e) {}
          window.location.href = '/mine';
          return;
        }
      } catch (e) { /* not hers either */ }

      coordData = null;
      notice = 'That passphrase was not accepted.';
      pass = '';
    }
    else { coordData = r.data; notice = ''; }
    render();
  }

  function startPoll(){
    if (poll) return;
    poll = setInterval(function(){ if(!coord && me) loadNeeds(); }, 10000);
  }

  // Tells the coordinators that something changed. Deliberately not
  // awaited: a slow or failing email must never hold up the page or
  // stop someone signing up.
  // Lets the coordinator know someone has asked to read the journal.
  // Fire and forget, like the other notifications.
  // Tells a friend they can read the journal, with the link. Also used
  // to send it again later, which is why it reports whether it worked.
  async function notifyGranted(email, name, again) {
    try {
      var res = await fetch('/api/notify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'access-granted', email: email, name: name, again: again === true
        })
      });
      return res.ok;
    } catch (e) { return false; }
  }

  function notifyAccess(email, name) {
    try {
      fetch('/api/notify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'access-request', email: email, name: name })
      }).catch(function(){});
    } catch (e) {}
  }

  function notify(id, action) {
    try {
      fetch('/api/notify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: id, action: action })
      }).catch(function(){});
    } catch (e) {}
  }

  function inviteBody(n){
    return ['Volunteer: ' + (n.volunteer_name||''), 'Status: FILLED', '',
      n.location ? ('Where: ' + n.location) : '', '',
      n.instructions||'', '',
      'Thank you so much for helping. If something changes on your end, release the slot on the signup page and we will find someone else.'
    ].join('\n');
  }

  function gate(){
    return '<div class="gate"><h2>Add yourself first</h2>'
      + '<p>We need your email so we can send you the calendar invitation when you sign up for something. '
      + 'That way you get reminders, and if a time changes your calendar updates on its own — no texts needed.</p>'
      + '<div class="field-row">'
      +   '<div class="field-half">'
      +     '<label for="r-first">First name <span class="req">required</span></label>'
      +     '<input type="text" id="r-first" autocomplete="given-name" autocapitalize="words" />'
      +     '<div class="field-err" id="e-first"></div>'
      +   '</div>'
      +   '<div class="field-half">'
      +     '<label for="r-last">Last name <span class="req">required</span></label>'
      +     '<input type="text" id="r-last" autocomplete="family-name" autocapitalize="words" />'
      +     '<div class="field-err" id="e-last"></div>'
      +   '</div>'
      + '</div>'
      + '<label for="r-email">Email <span class="req">required</span></label>'
      + '<input type="email" id="r-email" autocomplete="email" inputmode="email" autocapitalize="none" placeholder="so we can send you the invitation" />'
      + '<div class="field-err" id="e-email"></div>'
      + '<label for="r-phone">Phone <span class="opt">optional</span></label>'
      + '<input type="tel" id="r-phone" autocomplete="tel" inputmode="tel" />'
      + '<p class="hint">Other friends only see your first name. The rest is so Tracey and the coordinators know exactly who is coming.</p>'
      + '<p class="hint">Been here before? Enter the same email and everything you have signed up for comes straight back.</p>'
      + '<p class="hint">Only Tracey and the coordinators see your contact details. Other friends just see your first name next to what you have signed up for.</p>'
      + '<div class="err" id="r-err" style="display:none"></div>'
      + '<button class="btn primary" data-action="register">Continue</button></div>';
  }

  // The journal entry point. Always visible, so nobody has to be told
  // it exists. What it does depends on where they stand.
  function journeyButton() {
    var state = access ? access.access : 'none';
    if (state === 'approved' || state === 'close') {
      var unread = (access && access.unread) ? Number(access.unread) : 0;
      return '<button class="journey" data-action="journal">'
        + '<strong>Tracey\u2019s journey'
        +   (unread ? '<span class="count">' + unread + ' new</span>' : '')
        + '</strong>'
        + '<span>' + (unread
            ? (unread === 1 ? 'She has written something new.'
                            : 'She has written ' + unread + ' new pieces.')
            : 'Her own words on how things are going.') + '</span></button>';
    }
    if (access && access.requested) {
      return '<button class="journey" data-action="journey-pending">'
        + '<strong>Tracey\u2019s journey</strong>'
        + '<span>You have asked to read her updates. ' + esc(APPROVER) + ' will let you in shortly.</span></button>';
    }
    return '<button class="journey" data-action="journey-ask">'
      + '<strong>Tracey\u2019s journey</strong>'
      + '<span>She writes about how things are going. Tap to ask for access.</span></button>';
  }

  // Written for friends rather than for whoever built it: plain language,
  // answers to what people actually hesitate over. The coordinator part
  // only appears when the coordinator view is open.
  function helpPanel() {
    function q(question, answer) {
      return '<details><summary>' + question + '</summary>' + answer + '</details>';
    }

    var friend = ''
      + q('What is this page for?',
          '<p>Tracey is recovering, and a lot of people have offered to help. '
        + 'This is one list everyone can see, so nothing gets doubled up and '
        + 'nobody has to coordinate over text.</p>')

      + q('Do I have to sign up for anything?',
          '<p>Just your name and email, once. There is no password and no app '
        + 'to install. Your browser remembers you afterwards.</p>')

      + q('Why do you need my email?',
          '<p>So the calendar invitation can reach you. That way the time and '
        + 'place land on your own calendar, and if anything changes your '
        + 'calendar updates on its own \u2014 nobody has to text you.</p>'
        + '<p>Only ' + esc(CONTACT) + ' and Tracey see your email and '
        + 'phone number. Other friends just see your name next to whatever you '
        + 'have signed up for.</p>')

      + q('What happens after I tap \u201cI can help\u201d?',
          '<p>It shows as covered straight away, so nobody else takes it. '
        + 'Shortly afterwards a calendar invitation arrives by email. Open it '
        + 'and it goes on your calendar.</p>'
        + '<p>If it has not arrived within a few minutes, check your junk '
        + 'folder \u2014 and tell ' + esc(CONTACT) + ', because it may mean the '
        + 'address was mistyped.</p>')

      + q('Something came up and I cannot make it',
          '<p>Open the page, find what you signed up for, and tap '
        + '<strong>Free up this slot</strong>. It goes straight back on the '
        + 'list for someone else, and the coordinators are told.</p>'
        + '<p>Please do it there rather than by text. Declining the calendar '
        + 'invitation does <strong>not</strong> free it up \u2014 the page will '
        + 'still show you as covering it, and nobody will know to find '
        + 'somebody else.</p>'
        + '<p><strong>If it is close to the time</strong>, freeing it up may '
        + 'not be enough on its own \u2014 nobody may look at the page before '
        + 'it comes round. Please ask another friend if they can step in for '
        + 'you.</p>'
        + '<p>If you cannot find anyone, reach out to Tracey or ' + esc(CONTACT)
        + ' so they can make a quick adjustment. This is the one time it is '
        + 'worth interrupting them.</p>')

      + q('The time changed. Do I need to do anything?',
          '<p>You will get an email saying it has changed, with a fresh '
        + 'invitation, and your calendar updates itself.</p>'
        + '<p>The one thing worth doing: if the new time does not work for you, '
        + 'free up the slot on the page so someone else can take it.</p>')

      + q('What are the rounded buttons above the list?',
          '<p>They are the kinds of help being asked for \u2014 Rides, Izzy, '
        + 'Walks, Other \u2014 and tapping one narrows the list to just that '
        + 'kind.</p>'
        + '<p>The number on each is how many are still open in that group. One '
        + 'greyed out with no number has nothing open just now.</p>'
        + '<p><strong>All</strong> shows everything, and is where you start. '
        + 'They only change what you are looking at; nothing is hidden.</p>')

      + q('What does the orange NEW mean?',
          '<p>Something added since you last signed up for anything. It stays '
        + 'there across visits until you take something on, so you will not '
        + 'miss it by glancing at the page and closing it again.</p>')

      + q('Some say ANYTIME instead of a time',
          '<p>Those are things with no appointment attached \u2014 shopping, an '
        + 'errand, something dropped off. Fit them around whatever else you are '
        + 'doing. If one says <em>by Thursday</em>, that is when it is needed '
        + 'by, not a time to turn up.</p>'
        + '<p>They come with no calendar invitation, because there is nothing '
        + 'to put on a calendar.</p>')

      + q('One says the ride home is covered but not the ride there',
          '<p>Some appointments need a lift each way, and the two journeys are '
        + 'listed separately so different people can take them.</p>'
        + '<p>If you see one marked in orange, its other half is already '
        + 'covered and somebody is relying on half a journey. Those are worth '
        + 'taking first.</p>'
        + '<p>Sign up for one and you will be asked whether you can do the '
        + 'other too. Saying no is a perfectly good answer.</p>')

      + q('Can I keep this on my home screen?',
          '<p>Yes, and it is worth it \u2014 one tap rather than hunting for the '
        + 'link. Tap the card at the top of the page and it will show you how, '
        + 'or use <strong>Share</strong> then <strong>Add to Home Screen</strong> '
        + 'in Safari.</p>')

      + q('What is \u201cTracey\u2019s journey\u201d?',
          '<p>Tracey writes about how her recovery is going. Reading it needs '
        + esc(APPROVER) + ' to approve you first \u2014 signing up to help does '
        + 'not automatically give you access.</p>'
        + '<p>Tap the button and it will ask on your behalf. A number on it '
        + 'means she has written something you have not read.</p>')

      + q('I am on a different phone or my browser forgot me',
          '<p>Enter the same email address again. Everything you signed up for '
        + 'comes straight back.</p>')

      + q('Something looks wrong',
          '<p>There is a <strong>Something not working?</strong> line at the '
        + 'very bottom of the page. Tap it and say what happened \u2014 it goes '
        + 'straight to ' + esc(CONTACT) + ', and however small it seems he '
        + 'would rather know.</p>'
        + '<p>Worth doing for anything that did not behave as you expected: a '
        + 'need at the wrong time, someone shown who should not be, a button '
        + 'that did nothing.</p>'
        + '<p>Not Tracey \u2014 she has asked to be left out of the day-to-day '
        + 'while she is healing, and messages cost her energy she does not have '
        + 'to spare.</p>');

    var coord = !coord_mode() ? '' : ''
      + '<h3>For coordinators</h3>'

      + q('Creating a need',
          '<p>Make the event on the Tracey Recovery calendar in Outlook and add '
        + 'the signup address as an attendee. It appears here within seconds.</p>'
        + '<p>Tag the title if the words alone would not say what kind of help '
        + 'it is: <code>#rides</code> <code>#izzy</code> <code>#walks</code> '
        + '<code>#other</code>. The tag is removed before friends see it.</p>'
        + '<p>The first letter or two is enough \u2014 <code>#r</code>, '
        + '<code>#wal</code>, <code>#iz</code> \u2014 and a typo is forgiven, '
        + 'so <code>#ryde</code> and <code>#wlaks</code> both land correctly. '
        + 'A word it does not recognise is left in the title, which is how you '
        + 'can tell it was not read as a tag.</p>'
        + '<p>Repeating events work: one invitation becomes one entry per '
        + 'occurrence, each claimable on its own, up to thirty at a time.</p>')

      + q('An appointment needing a lift each way',
          '<p>Tag it <code>#roundtrip</code> and one event becomes two: a ride '
        + 'there at the start time, a ride home at the end. Either can be '
        + 'claimed on its own, and whoever takes one is asked about the '
        + 'other.</p>'
        + '<p>Whichever is left shows in orange and sorts to the top, because a '
        + 'covered outbound and an empty return is how somebody ends up '
        + 'stranded.</p>'
        + '<p><code>#bothways</code> and <code>#ride2</code> do the same thing.</p>')

      + q('Changing or cancelling',
          '<p>Edit the event in Outlook and <strong>Send Update</strong> \u2014 '
        + 'not just Save. Save emails nobody, so nothing reaches this page.</p>'
        + '<p>Whoever claimed it is sent the updated invitation automatically '
        + 'and asked to free up the slot if the new time does not suit. '
        + 'Cancelling tells them it is off. Nothing for you to do either '
        + 'way.</p>')

      + q('Something that is not an appointment',
          '<p>A pint of milk does not belong on a calendar. Use '
        + '<strong>Ask for something</strong> at the top: a description, '
        + 'anything worth knowing, and a by-when if it matters. Leave the date '
        + 'blank and it stays up until somebody does it.</p>'
        + '<p>Tracey can post these herself from her own page.</p>'
        + '<p>Either of you can also email the signup address with '
        + '<code>#ask</code> in the subject. Write the deadline in plain words '
        + '\u2014 <em>by Thursday</em>, <em>by tomorrow afternoon</em> \u2014 and '
        + 'it will be read out of the subject.</p>')

      + q('Where to collect her, and where to take her',
          '<p>A ride names both ends: <em>Home, Mosier \u2192 Providence '
        + 'Rehab</em> going out, and the reverse coming back.</p>'
        + '<p>Outlook only holds the destination \u2014 both ends are obvious '
        + 'to Tracey and neither gets typed \u2014 so her address is held in '
        + 'settings instead. There is nothing to add when creating an '
        + 'event.</p>'
        + '<p>Walks, errands and anything else show their location as '
        + 'written.</p>')

      + q('Who can see her address',
          '<p>Cards always say <strong>Home</strong> and the town \u2014 for '
        + 'everyone, including you. Her street address never appears as text '
        + 'anywhere on the page.</p>'
        + '<p>It lives inside the map links instead, which is more useful '
        + 'anyway: a friend wants to know how far it is from wherever they '
        + 'are, and a map can answer that.</p>'
        + '<p><strong>Directions</strong> on the pickup starts from wherever '
        + 'they are \u2014 that is the question they are asking. '
        + '<strong>Route</strong> on the destination starts from the pickup, '
        + 'because by then they will be standing there with her in the car.</p>'
        + '<p>Tap <strong>Address</strong> next to anyone in Registered friends '
        + 'to give them that link. They are emailed the address once as well, '
        + 'so it is in their inbox.</p>'
        + '<p>Anyone who has claimed a ride gets it regardless \u2014 they '
        + 'cannot do the job otherwise.</p>'
        + '<p>Everywhere else \u2014 a clinic, a caf\u00e9 \u2014 has a '
        + 'Directions link for everybody, because none of those is her front '
        + 'door.</p>')

      + q('Something is filed under the wrong kind',
          '<p>Every need in the panel has a row of <strong>Kind</strong> '
        + 'buttons. Tap the right one and it moves.</p>'
        + '<p>The category is guessed from the words when there is no tag, and '
        + 'a title like \u201cPhysio\u201d says nothing about a lift. Rather '
        + 'than ask Tracey to edit and resend the event, just put it where it '
        + 'belongs.</p>'
        + '<p>Nothing is sent to Outlook and nobody is emailed. Where something '
        + 'sits on this page is a coordination matter, not a change to her '
        + 'appointment.</p>')

      + q('Someone phoned instead of using the page',
          '<p>Use <strong>Sign someone up</strong>. They get the same calendar '
        + 'invitation and appear in the roster.</p>')

      + q('Swapping one person for another',
          '<p>Free the slot in <strong>Covered</strong>, then sign the new '
        + 'person up. The first person is not told automatically, so say '
        + 'something to them yourself.</p>')

      + q('A need will not go away',
          '<p>Tap <strong>Remove</strong> on it. Anyone who had signed up is '
        + 'emailed to say it is cancelled.</p>'
        + '<p>This happens when an event was cancelled in Outlook but the '
        + 'signup address was never an attendee \u2014 usually because the '
        + 'invitation was forwarded rather than the address being added to the '
        + 'event itself. Outlook sends its cancellation to its own attendees, '
        + 'so nothing reaches this page.</p>'
        + '<p>To avoid it: add the signup address to the event rather than '
        + 'forwarding the invitation on.</p>')

      + q('The Outlook invite list',
          '<p>Optional. Changes and cancellations reach friends on their own '
        + 'now. Adding them to the Outlook event as a real attendee only buys '
        + 'you one extra thing: you see their RSVP.</p>'
        + '<p>The daily check will mention anything sitting there more than a '
        + 'week, and otherwise leaves you alone.</p>')

      + q('Asking everyone to take a look',
          '<p><strong>Ask everyone</strong> at the top emails every registered '
        + 'friend a list of what is still open, with the link. Each goes '
        + 'separately, so nobody sees anyone else\u2019s address.</p>'
        + '<p>The bar says when you last did it, because the quickest way to '
        + 'make people stop reading these is to send two in a morning. Once a '
        + 'week, or when something genuinely needs covering, is about right.</p>')

      + q('Approving someone for the journal',
          '<p><strong>Waiting to read her updates</strong> lists anyone who has '
        + 'asked. Approving emails them to say so, with the link.</p>'
        + '<p><strong>Email link</strong> next to anyone already reading sends '
        + 'that again \u2014 useful for people approved before those emails '
        + 'existed.</p>'
        + '<p>Nobody is told which level they are on, and nobody sees any sign '
        + 'that posts exist which they cannot read.</p>')

      + q('Tracey wants to correct a post',
          '<p>She reposts the corrected version by email, and you hide the old '
        + 'one. Hiding keeps it in case she changes her mind; deleting is '
        + 'permanent.</p>')

      + q('Finding something that already happened',
          '<p>The panel shows what is still ahead, so it stays usable. Tap '
        + '<strong>Show past</strong> at the top to include everything that has '
        + 'already happened \u2014 useful for looking someone up, or for tidying '
        + 'away things that should not have been there.</p>'
        + '<p>Nothing is ever deleted by hiding it. Friends only ever see what '
        + 'is ahead of them.</p>')

      + q('An email did not go out',
          '<p>If the mail service was down when something happened, a '
        + '<strong>Did not go out</strong> section appears at the top of this '
        + 'panel listing what was missed \u2014 a calendar invitation, a notice '
        + 'that something changed, a journal link.</p>'
        + '<p><strong>Send it again</strong> replays the same message. It is '
        + 'safe: nothing that already arrived is duplicated.</p>'
        + '<p><strong>Dealt with</strong> takes it off the list without sending '
        + '\u2014 for when you have already phoned the person, or it no longer '
        + 'matters.</p>'
        + '<p>Claiming never waits on email, which is why a friend can still '
        + 'sign up when the mail service is down. The cost of that is this '
        + 'list.</p>')

      + q('Checking the system is working',
          '<p>Open <code>/api/health</code> on this site. '
        + '<code>&quot;healthy&quot;: true</code> is the whole answer. It also '
        + 'runs itself daily and emails only if something is wrong.</p>');

    return '<div class="help">' + friend + coord + '</div>';
  }

  function coord_mode() { return coord; }

  // What this friend has taken on. Shown above everything else, because
  // their own commitments are the one thing they should never hunt for.
  // What this friend has taken on, as the actual cards rather than a
  // summary. A list of titles meant they still had to go and find the
  // thing to see the address, tap Directions, or free it up — which is
  // most of why anybody opens this page having already signed up.
  //
  // These are left out of "Already covered" below, so nothing appears
  // twice.
  function yoursBox() {
    var mine = needs.filter(function(n){
      return n.status === 'FILLED' && n.is_mine === true;
    }).sort(function(a, b){
      if (!a.date && !b.date) return 0;
      if (!a.date) return -1;
      if (!b.date) return 1;
      if (a.date !== b.date) return a.date < b.date ? -1 : 1;
      return 0;
    });

    if (!mine.length) return '';

    // Only the next couple, or somebody covering five things would have
    // to scroll past their own list to reach anything they could pick
    // up — which inverts what the page is for.
    var SHOW = 2;
    var visible = showMine ? mine : mine.slice(0, SHOW);
    var rest = mine.length - visible.length;

    return '<div class="section-title">You are covering</div>'
      + '<div class="section-sub">'
      +   (mine.length === 1 ? 'One thing' : mine.length + ' things')
      +   '. Free one up here if something comes up.</div>'
      + visible.map(row).join('')
      + (rest > 0
          ? '<div class="moreline"><button data-action="showmine">'
            + 'Show ' + rest + ' more you are covering</button></div>'
          : (showMine && mine.length > SHOW
              ? '<div class="moreline"><button data-action="showmine">'
                + 'Show fewer</button></div>'
              : ''));
  }

  // One collective line, never a tally per person. Who did what is
  // already visible next to each need; counting and ranking would turn
  // helping into a scoreboard, and the person with least capacity would
  // come off worst.
  function togetherLine() {
    var covered = needs.filter(function(n){ return n.status === 'FILLED'; });
    if (!covered.length) return '';

    var people = {};
    covered.forEach(function(n){
      if (n.volunteer_name) people[n.volunteer_name] = true;
    });
    var n_people = Object.keys(people).length;
    if (!n_people) return '';

    return '<p class="together">'
      + n_people + (n_people === 1 ? ' friend is' : ' friends are') + ' covering '
      + covered.length + (covered.length === 1 ? ' thing' : ' things') + '.'
      + '</p>';
  }

  // Collapsed by default: with a fortnight of needs on screen, a note on
  // every card turns a scannable list into a wall. Open by default on
  // your own claim, because that is the person who has to act on it.
  // The other half of an appointment. Whichever leg is still open is the
  // one that matters: a covered ride there and an uncovered ride home is
  // how somebody ends up stranded.
  // The browser's own confirm box only offers OK and Cancel, which makes
  // a yes/no question read awkwardly. This asks properly, and resolves
  // to true or false so the claim flow can wait on it.
  // A plain walkthrough rather than a yes/no, so it uses the same card
  // style without pretending to be a question.
  function showHowTo() {
    return new Promise(function (resolve) {
      var bg = document.createElement('div');
      bg.className = 'ask-bg';
      bg.innerHTML = '<div class="ask">'
        + '<h3>Add it to your home screen</h3>'
        + '<div class="howto"><ol>'
        +   '<li>Tap the <strong>Share</strong> button at the bottom of Safari '
        +     '\u2014 a square with an arrow pointing up.</li>'
        +   '<li>Scroll down the list and tap <strong>Add to Home Screen</strong>.</li>'
        +   '<li>Tap <strong>Add</strong>.</li>'
        + '</ol><p style="margin:14px 0 0">It will sit with your apps, and open '
        + 'straight to this page.</p></div>'
        + '<div class="acts" style="margin-top:18px">'
        +   '<button class="yes" data-close="1">Got it</button>'
        + '</div></div>';

      function done() {
        if (bg.parentNode) bg.parentNode.removeChild(bg);
        document.removeEventListener('keydown', onKey);
        resolve();
      }
      function onKey(ev) { if (ev.key === 'Escape') done(); }

      bg.addEventListener('click', function (ev) {
        if (ev.target.closest('[data-close]') || ev.target === bg) done();
      });
      document.addEventListener('keydown', onKey);
      document.body.appendChild(bg);
    });
  }

  function askYesNo(heading, detail, yesLabel, noLabel) {
    return new Promise(function (resolve) {
      var bg = document.createElement('div');
      bg.className = 'ask-bg';
      bg.innerHTML = '<div class="ask">'
        + '<h3>' + esc(heading) + '</h3>'
        + '<p>' + esc(detail) + '</p>'
        + '<div class="acts">'
        +   '<button class="yes" data-yes="1">' + esc(yesLabel) + '</button>'
        +   '<button data-yes="0">' + esc(noLabel) + '</button>'
        + '</div></div>';

      function done(v) {
        if (bg.parentNode) bg.parentNode.removeChild(bg);
        document.removeEventListener('keydown', onKey);
        resolve(v);
      }
      function onKey(e) { if (e.key === 'Escape') done(false); }

      bg.addEventListener('click', function (e) {
        var b = e.target.closest('[data-yes]');
        if (b) { done(b.getAttribute('data-yes') === '1'); return; }
        // Tapping outside is not an answer either way, so treat it as no.
        if (e.target === bg) done(false);
      });
      document.addEventListener('keydown', onKey);
      document.body.appendChild(bg);
    });
  }

  // Adding to the home screen.
  //
  // Android browsers fire an event we can use to show the real install
  // dialog. Safari does not and never has, so on an iPhone the only
  // route is Share then Add to Home Screen \u2014 which most people have
  // never noticed. Showing them where it is is the whole value here.
  function alreadyInstalled() {
    try {
      return window.matchMedia('(display-mode: standalone)').matches
          || window.navigator.standalone === true;
    } catch (e) { return false; }
  }

  function isApple() {
    return /iPad|iPhone|iPod/.test(navigator.userAgent)
        || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  }

  function addHomeCard() {
    if (hideAdd || alreadyInstalled()) return '';
    if (!isApple() && !installEvt) return '';   // nothing useful to offer

    return '<div class="addhome" data-action="addhome">'
      + '<span class="ic">'
      +   '<svg viewBox="0 0 24 24" fill="none" stroke="#3D5A5B" stroke-width="2" '
      +   'stroke-linecap="round" stroke-linejoin="round">'
      +   '<rect x="5" y="2" width="14" height="20" rx="2"/>'
      +   '<line x1="12" y1="8" x2="12" y2="14"/><line x1="9" y1="11" x2="15" y2="11"/>'
      +   '</svg></span>'
      + '<span class="tx"><strong>Keep this on your home screen</strong>'
      +   '<span>One tap to see what Tracey needs.</span></span>'
      + '<button class="x" data-action="hideadd" aria-label="Dismiss">\u00d7</button>'
      + '</div>';
  }

  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-'
      + String(d.getMonth() + 1).padStart(2, '0') + '-'
      + String(d.getDate()).padStart(2, '0');
  }

  // "yesterday" reads better than a timestamp when the question is
  // really "have I already pestered everyone this morning?"
  function agoWords(iso) {
    try {
      var then = new Date(iso);
      var hours = (Date.now() - then.getTime()) / 3600000;
      if (hours < 1) return 'less than an hour ago';
      if (hours < 24) return Math.round(hours) + ' hours ago';
      var days = Math.round(hours / 24);
      if (days === 1) return 'yesterday';
      if (days < 14) return days + ' days ago';
      return 'on ' + then.toLocaleDateString(undefined,
        { month: 'short', day: 'numeric' });
    } catch (e) { return 'recently'; }
  }

  // How an untimed request describes itself. A day, a loose window, both
  // or neither — whatever Tracey actually said, rather than a fabricated
  // precision she did not ask for.
  function anytimeWhen(n) {
    var day = n.date ? fmtL(n.date) : '';
    var win = String(n.start_time || '').trim();
    if (day && win) return esc(day) + ', ' + esc(win);
    if (day) return 'by ' + esc(day);
    if (win) return esc(win);
    return 'whenever suits you';
  }

  // Where to collect her and where to take her.
  //
  // Outlook only ever holds the destination, because both ends are
  // obvious to Tracey and neither gets typed. A friend claimed a ride
  // and then had to ask where she lives, which is what this is for.
  //
  // Anyone browsing sees "Home" and the town; whoever has taken it sees
  // the street address, supplied from settings rather than from the
  // event.
  // A link into whichever maps app they use, which answers the question
  // an address on a card never could: how far is that from where I am.
  //
  // The pickup link starts from wherever they are — that is the decision
  // they are making. The drop-off link starts from the pickup, because
  // by then they will be standing there with Tracey in the car, and
  // "how far from home" would be the wrong answer.
  function directionsTo(place, isHome, fromPlace, fromIsHome) {
    // Her street address only exists inside a link, and only for
    // somebody allowed to have it.
    var dest = isHome ? homeAddr : place;
    if (!dest) return '';

    // Apple Maps on an iPhone or iPad, which is where most of these
    // friends are. The same link opens Google Maps on Android and in a
    // browser, so nobody is left out.
    var origin = fromPlace ? (fromIsHome ? homeAddr : fromPlace) : null;
    var url = isApple()
      ? 'https://maps.apple.com/?daddr=' + encodeURIComponent(dest)
        + (origin ? '&saddr=' + encodeURIComponent(origin) : '')
        + '&dirflg=d'
      : 'https://www.google.com/maps/dir/?api=1&destination='
        + encodeURIComponent(dest)
        + (origin ? '&origin=' + encodeURIComponent(origin) : '');
    // No starting point rather than a vague one: the map then uses where
    // they actually are, which beats a guess.

    return ' <a href="' + url + '" target="_blank" rel="noopener">'
      + (fromPlace ? 'Route' : 'Directions') + '</a>';
  }

  function journeyLine(n) {
    var from = (n.pickup || '').trim();
    var to = (n.dropoff || '').trim();
    var label = homeLabel();

    // Not a ride: the location is just where the thing happens.
    if (!from && !to) {
      return n.location
        ? '<p class="loc">' + esc(n.location)
          + directionsTo(n.location, false, null, false) + '</p>'
        : '';
    }

    function end(place, fromPlace) {
      var isHome = place === label;
      return '<strong>' + esc(place) + '</strong>'
        + directionsTo(place, isHome, fromPlace, fromPlace === label);
    }

    if (from && to) {
      return '<p class="journey-line">' + end(from, null)
        + '<span class="to">\u2192</span>' + end(to, from) + '</p>';
    }

    return '<p class="journey-line">'
      + (from ? 'Collect from ' + end(from, null)
              : 'Taking her to ' + end(to, null))
      + '</p>';
  }

  // Whatever the database is calling home. Read off the data rather than
  // hardcoded, so changing it in settings changes it everywhere.
  function homeLabel() {
    var r = (needs || []).filter(function(n){
      return n.category === 'rides' && (n.pickup || n.dropoff); })[0];
    if (!r) return 'Home';
    return (r.leg === 'back' ? r.dropoff : r.pickup) || 'Home';
  }

  function pairLine(n) {
    if (!n.partner_id) return '';

    // 'out' is the ride to the appointment, 'back' is the ride home. The
    // other half is therefore the opposite one.
    var otherWord = n.leg === 'out' ? 'ride home' : 'ride there';
    var thisWord  = n.leg === 'out' ? 'ride there' : 'ride home';
    var partnerOpen = n.partner_status === 'OPEN';
    var mine = n.is_mine === true;
    var partnerMine = n.partner_is_mine === true;

    // This one is uncovered and the other half is taken: somebody is
    // already relying on half a journey.
    if (n.status === 'OPEN' && !partnerOpen) {
      return '<p class="pair urgent">The ' + otherWord + ' is covered \u2014 '
        + 'she has no ' + (n.leg === 'out' ? 'way there' : 'way home')
        + ' without this</p>';
    }

    if (partnerOpen) {
      return '<p class="pair">Round trip \u00b7 the ' + otherWord
        + ' at ' + esc(n.partner_time || '') + ' still needs someone</p>';
    }

    if (mine && partnerMine) {
      return '<p class="pair done">Round trip \u00b7 you have both halves</p>';
    }

    if (partnerMine) {
      return '<p class="pair done">Round trip \u00b7 you have the '
        + otherWord + '</p>';
    }

    if (mine) {
      return '<p class="pair done">Round trip \u00b7 you have the ' + thisWord
        + ', someone else has the ' + otherWord + '</p>';
    }

    return '<p class="pair done">Round trip \u00b7 both halves are covered</p>';
  }

  function instrBlock(n, mine) {
    var t = String(n.instructions || '').trim();
    if (!t) return '';
    var label = mine ? 'What you need to know' : 'Details';
    return '<details class="instr"' + (mine ? ' open' : '') + '>'
      + '<summary>' + label + '</summary>'
      + '<p class="text">' + esc(t) + '</p></details>';
  }

  function row(n){
    var c = catBy[n.category] || catBy.other;
    var filled = n.status === 'FILLED';
    var mine = filled && n.is_mine === true;
    var act;
    if (filled) {
      act = '<p class="vol">Covered by <strong>' + esc(mine ? 'you' : (n.volunteer_name || 'a friend')) + '</strong>'
          + (mine ? '<span class="yours">yours</span>' : '') + '</p>'
          + (mine ? '<button class="btn ghost" data-action="release" data-id="'+n.id+'">Can\'t make it anymore? Free up this slot</button>' : '');
    } else {
      var b = busy === n.id;
      act = '<button class="btn primary" data-action="claim" data-id="'+n.id+'"'+(b?' disabled':'')+'>'
          + (b ? 'Signing you up…' : 'I can help') + '</button>';
    }
    var orphan = !filled && n.partner_id && n.partner_status === 'FILLED';
    return '<div class="row '+(filled?'filled':'')+' '+(mine?'mine':'')
      + (orphan ? ' orphan' : '')+'" style="--cat-color:'+c.color+'">'
      + '<div class="when">'
      +   (n.anytime
            ? (n.date ? 'by<br>' + fmtD(n.date) : 'Anytime')
              + (n.start_time ? '<span class="time">'+esc(n.start_time)+'</span>' : '')
            : fmtD(n.date)+'<span class="time">'+esc(n.start_time)+'–'+esc(n.end_time)+'</span>')
      + '</div>'
      + '<div class="bd"><p class="ttl">'+esc(n.title)
      +   ((newIds && newIds[n.id] && n.status === 'OPEN')
            ? '<span class="newtag">New</span>' : '')+'</p>'
      + journeyLine(n)
      + pairLine(n)
      + instrBlock(n, mine)
      + act + '</div></div>';
  }

  function inviteCard(n){
    var c = function(k){ return copiedKey===k ? '<span class="copied">Copied</span>' : ''; };
    return '<div class="invite"><h4>'+esc(n.title)+' — '+esc(first(n.volunteer_name))+'</h4>'
      + '<p class="meta">'
      +   (n.anytime
            ? '<span class="anytime-chip">Anytime</span>' + anytimeWhen(n)
            : fmtL(n.date)+', '+esc(n.start_time)+'–'+esc(n.end_time))
      + '</p>'
      + '<div class="field"><label>Add as attendee'+c('e'+n.id)+'</label>'
      + '<input class="copyline" readonly value="'+esc(n.volunteer_email)+'" data-action="copy" data-key="e'+n.id+'" data-copy="'+esc(n.volunteer_email)+'" /></div>'
      + '<div class="field"><label>Event body'+c('b'+n.id)+'</label>'
      + '<textarea readonly data-action="copy" data-key="b'+n.id+'" data-copy="'+esc(inviteBody(n))+'">'+esc(inviteBody(n))+'</textarea></div>'
      + '<button class="btn primary small" data-action="invited" data-id="'+n.id+'">Mark invite sent</button></div>';
  }

  function render(){
    modeBtn.textContent = coord ? 'Friend view' : 'Coordinator';
    modeBtn.className = 'modetoggle' + (coord ? ' on' : '');
    content.className = '';
    var banner = notice ? '<div class="banner">'+esc(notice)+'</div>' : '';

    if (coord) {
      h1.textContent = 'Coordinator';
      if (!coordData) {
        sub.textContent = '';
        content.innerHTML = banner + '<div class="gate"><h2>Coordinator access</h2>'
          + '<p>Enter the passphrase to see volunteer contact details and pending invites.</p>'
          + '<input type="password" id="c-pass" placeholder="Passphrase" />'
          + '<button class="btn primary" data-action="unlock">Unlock</button></div>';
        return;
      }
      sub.textContent = 'Claims waiting on an Outlook invite, and everyone who has registered.';
      var all = coordData.needs || [], vols = coordData.volunteers || [];
      var pend = all.filter(function(n){ return n.status==='FILLED' && !n.invited; });
      var openOnes = all.filter(function(n){ return n.status === 'OPEN'; });
      var claimed  = all.filter(function(n){ return n.status === 'FILLED'; });

      // Everyone registered, offered as suggestions so assigning a
      // returning friend is a tap rather than retyping their address.
      var roster = '<datalist id="roster">' + vols.map(function(v){
        return '<option value="' + esc(v.email) + '">' + esc(v.name) + '</option>';
      }).join('') + '</datalist>';

      // Putting something in the right place after the fact. The guess
      // from the words is often right and sometimes is not, and a tag
      // can be mistyped past recognising.
      function catRow(n) {
        // Not on a leg of a round trip. It is a ride by definition, the
        // change would not survive Tracey's next update to that event,
        // and the journey line only resolves a pickup and a drop-off for
        // rides. A control that half-works is worse than none.
        if (n.pair_key) return '';

        return '<div class="catrow"><span class="lbl">Kind</span>'
          + CATS.map(function(c){
              var here = (catBy[n.category] ? catBy[n.category].key : 'other') === c.key;
              return '<button data-action="setcat" data-id="' + n.id + '"'
                + ' data-cat="' + c.key + '"' + (here ? ' class="on"' : '')
                + '>' + c.label + '</button>';
            }).join('')
          + '</div>';
      }

      function assignCard(n) {
        // A leg whose other half is already covered: someone is relying
        // on this being filled.
        var orphaned = n.pair_key && all.some(function(o){
          return o.pair_key === n.pair_key && o.id !== n.id && o.status === 'FILLED';
        });
        return '<div class="assign"' + (orphaned
            ? ' style="border-color:var(--clay);box-shadow:0 0 0 1px var(--clay)"' : '') + '>'
          + '<h4>' + esc(n.title) + '</h4>'
          + (orphaned ? '<p class="ameta" style="color:var(--clay);font-weight:600">'
                        + 'The other half of this trip is covered \u2014 she has no way '
                        + (n.leg === 'out' ? 'there' : 'home') + '</p>' : '')
          + '<p class="ameta">' + fmtL(n.date) + ', ' + esc(n.start_time) + '</p>'
          + '<div class="arow">'
          +   '<input type="text" id="an-' + n.id + '" placeholder="Name" autocapitalize="words" />'
          +   '<input type="email" id="ae-' + n.id + '" placeholder="Email" list="roster" autocapitalize="none" inputmode="email" />'
          + '</div>'
          + catRow(n)
          + '<div class="field-err" id="aerr-' + n.id + '"></div>'
          + '<div class="postbtns">'
          +   '<button class="btn primary small" data-action="assign" data-id="' + n.id + '">Sign them up</button>'
          +   '<button class="danger" data-action="remove" data-id="' + n.id + '">Remove</button>'
          + '</div></div>';
      }

      function claimedCard(n) {
        return '<div class="assign">'
          + '<h4>' + esc(n.title) + '</h4>'
          + '<p class="ameta">' + fmtL(n.date) + ', ' + esc(n.start_time) + '<br>'
          +   '<strong>' + esc(n.volunteer_name || '') + '</strong>'
          +   (n.volunteer_email ? ' \u00b7 ' + esc(n.volunteer_email) : '')
          +   (n.invited ? ' \u00b7 invite sent' : ' \u00b7 invite not sent yet') + '</p>'
          + (String(n.instructions || '').trim()
              ? '<details class="instr"><summary>Details</summary>'
                + '<p class="text">' + esc(String(n.instructions).trim()) + '</p></details>'
              : '')
          + catRow(n)
          + '<button class="btn ghost" data-action="unassign" data-id="' + n.id + '">They cancelled \u2014 free this up</button>'
          + '<div class="postbtns" style="margin-top:8px">'
          +   '<button class="danger" data-action="remove" data-id="' + n.id + '">Remove this need</button>'
          + '</div></div>';
      }

      var pending = coordData.pending || [];

      function pendingRow(p) {
        return '<div class="tierrow">'
          + '<div class="who"><strong>' + esc(p.name) + '</strong>'
          +   '<div class="em">' + esc(p.email) + '</div></div>'
          + '<div class="tierbtns">'
          +   '<button data-action="settier" data-email="' + esc(p.email) + '" data-level="approved">Approve</button>'
          +   '<button data-action="settier" data-email="' + esc(p.email) + '" data-level="none">Not now</button>'
          + '</div></div>';
      }

      // Three tiers. Close is dormant for now \u2014 it shows the same
      // journal plus anything Tracey keeps to a smaller circle. Nobody
      // on a lower tier sees any sign that those posts exist.
      function tierRow(p) {
        var lvl = p.access || 'none';
        function b(level, label) {
          return '<button data-action="settier" data-email="' + esc(p.email) + '"'
            + ' data-level="' + level + '"'
            + (lvl === level ? ' class="on"' : '') + '>' + label + '</button>';
        }
        var reading = lvl === 'approved' || lvl === 'close';
        var knows = p.knows_address === true;
        return '<div class="tierrow">'
          + '<div class="who"><strong>' + esc(p.name) + '</strong>'
          +   '<div class="em">' + esc(p.email)
          +   (p.phone ? ' \u00b7 ' + esc(p.phone) : '')
          +   (knows ? ' \u00b7 has her address' : '') + '</div></div>'
          + '<div class="tierbtns">'
          +   '<button data-action="setaddr" data-email="' + esc(p.email) + '"'
          +     ' data-name="' + esc(p.name) + '"'
          +     ' data-knows="' + (knows ? '0' : '1') + '"'
          +     (knows ? ' class="on"' : '') + '>Address</button>'
          +   b('none', 'No') + b('approved', 'Updates') + b('close', 'Close')
          +   (reading
                ? '<button data-action="resend" data-email="' + esc(p.email) + '"'
                  + ' data-name="' + esc(p.name) + '">Email link</button>'
                : '')
          + '</div></div>';
      }

      function postRow(p) {
        var vis = p.visibility || 'approved';
        var text = String(p.body || '').replace(/[#*>_`\-]/g, ' ')
                     .replace(/\s+/g, ' ').trim();
        var excerpt = text.length > 150 ? text.slice(0, 150) + '\u2026' : text;
        function b(level, label) {
          return '<button data-action="setvis" data-id="' + p.id + '"'
            + ' data-vis="' + level + '"'
            + (vis === level ? ' class="on"' : '') + '>' + label + '</button>';
        }
        return '<div class="postrow">'
          + '<h4>' + esc(p.title) + '</h4>'
          + '<p class="pmeta">' + fmtL(String(p.published).slice(0, 10))
          +   (vis === 'hidden' ? ' \u00b7 hidden from everyone'
              : vis === 'close' ? ' \u00b7 close circle only'
              : ' \u00b7 everyone approved') + '</p>'
          + (excerpt ? '<p class="excerpt">' + esc(excerpt) + '</p>' : '')
          + '<div class="postbtns">'
          +   b('approved', 'Everyone') + b('close', 'Close') + b('hidden', 'Hide')
          +   '<button class="danger" data-action="delpost" data-id="' + p.id + '">Delete</button>'
          + '</div></div>';
      }

      var pastCount = coordData.past_count || 0;
      var pastBar = '<div class="pastbar"><span>'
        + (showPast
            ? 'Showing everything, including what has already happened.'
            : (pastCount
                ? ('Showing what is still ahead. ' + pastCount + ' finished need'
                   + (pastCount === 1 ? '' : 's') + ' hidden.')
                : 'Showing what is still ahead.'))
        + '</span><button data-action="togglepast">'
        + (showPast ? 'Hide past' : 'Show past') + '</button></div>';

      // Asking everyone is the only thing here that reaches the whole
      // circle at once, so it says when it last went out.
      var stillOpen = all.filter(function(n){
        return n.status === 'OPEN' && n.date >= todayStr(); }).length;
      var lastSent = coordData.last_broadcast || '';
      var askBar = '<div class="askbar"><span>'
        + (stillOpen
            ? stillOpen + (stillOpen === 1 ? ' thing is' : ' things are') + ' still open. '
              + (lastSent ? 'Last asked ' + agoWords(lastSent) + '.' : 'Nobody has been asked yet.')
            : 'Everything is covered.')
        + '</span>'
        + (stillOpen
            ? '<button data-action="askall">Ask everyone</button>'
            : '')
        + '</div>';

      // Something Tracey needs that is not an appointment. No time, no
      // invitation, no Outlook — it simply sits on the list until
      // somebody picks it up.
      var reqForm = showReq
        ? '<div class="reqform">'
          + '<label>What is needed</label>'
          + '<input type="text" id="rq-title" placeholder="Milk, bread and something for dinner" />'
          + '<label>Anything else worth knowing</label>'
          + '<textarea id="rq-note" placeholder="She likes the oat milk in the blue carton"></textarea>'
          + '<label>Needed by (leave blank if it can wait)</label>'
          + '<input type="date" id="rq-by" />'
          + '<label>When would suit (optional)</label>'
          + '<input type="text" id="rq-when" placeholder="Thursday afternoon, or after rehab" />'
          + '<div class="field-err" id="rq-err"></div>'
          + '<div class="postbtns">'
          +   '<button class="btn primary small" data-action="postreq">Put it on the list</button>'
          +   '<button data-action="toggreq">Cancel</button>'
          + '</div></div>'
        : '<div class="askbar"><span>Something needed that is not an appointment?</span>'
          + '<button data-action="toggreq">Ask for something</button></div>';

      // What kind of message each failure was, in words rather than in
      // the internal name.
      var FAIL_WORDS = {
        'invite': 'calendar invitation',
        'claimed': 'alert that someone signed up',
        'released': 'alert that a slot was freed',
        'updated': 'notice that something changed',
        'cancelled': 'notice that it was cancelled',
        'journal-link': 'journal link'
      };

      function failRow(f) {
        var what = FAIL_WORDS[f.kind] || f.kind;
        return '<div class="failrow">'
          + '<h4>' + esc(what) + (f.title ? ' \u2014 ' + esc(f.title) : '') + '</h4>'
          + '<p class="fmeta">'
          +   'To ' + esc(f.recipient || 'unknown')
          +   (f.date ? ' \u00b7 ' + fmtL(f.date) : '')
          +   ' \u00b7 ' + f.attempts + (f.attempts === 1 ? ' attempt' : ' attempts')
          +   ' \u00b7 last tried ' + agoWords(f.last_tried)
          +   (f.retried ? ' \u00b7 already retried' : '')
          +   (f.detail ? '<span class="why">' + esc(f.detail) + '</span>' : '')
          + '</p>'
          + '<div class="postbtns">'
          +   '<button class="btn primary small" data-action="retry"'
          +     ' data-kind="' + esc(f.kind) + '"'
          +     ' data-to="' + esc(f.recipient || '') + '"'
          +     ' data-need="' + esc(f.need_id || '') + '">Send it again</button>'
          +   '<button data-action="dropfail"'
          +     ' data-kind="' + esc(f.kind) + '"'
          +     ' data-to="' + esc(f.recipient || '') + '"'
          +     ' data-need="' + esc(f.need_id || '') + '">Dealt with</button>'
          + '</div></div>';
      }

      var failBlock = fails.length
        ? '<div class="section-title">Did not go out</div>'
          + '<div class="section-sub">These were meant to be emailed and were '
          + 'not. Usually the mail service was briefly down. Sending again is '
          + 'safe \u2014 nothing is duplicated that already arrived.</div>'
          + fails.map(failRow).join('')
        : '';

      content.innerHTML = banner
        + (showHelp ? helpPanel() : '')
        + failBlock
        + reqForm
        + askBar
        + pastBar
        + '<div class="section-title">Needs an invite</div>'
        + '<div class="section-sub">' + (pend.length
            ? 'Optional. Changes and cancellations reach these friends on their own \u2014 '
              + 'adding them to the Outlook event as well means you see their RSVP.'
            : '') + '</div>'
        + (pend.length ? pend.map(inviteCard).join('') : '<div class="empty">All caught up. Every claimed need has an invite out.</div>')
        + '<div class="section-title">Sign someone up</div>'
        + '<div class="section-sub">' + (openOnes.length ? 'For friends who phone rather than use the page. They get the same calendar invitation.' : '') + '</div>'
        + roster
        + (openOnes.length ? openOnes.map(assignCard).join('') : '<div class="empty">Nothing open right now.</div>')
        + '<div class="section-title">Covered</div>'
        + '<div class="section-sub">' + (claimed.length ? 'Free one up here if someone cancels by phone.' : '') + '</div>'
        + (claimed.length ? claimed.map(claimedCard).join('') : '<div class="empty">Nothing claimed yet.</div>')
        + '<div class="section-title">Tracey\u2019s posts</div>'
        + '<div class="section-sub">' + ((posts && posts.length)
            ? 'Hide one if she reposts a correction. Nobody is told a post exists that they cannot see.'
            : 'She has not sent anything yet.') + '</div>'
        + ((posts && posts.length) ? posts.map(postRow).join('')
            : '<div class="empty">No posts yet.</div>')
        + '<div class="section-title">Waiting to read her updates</div>'
        + '<div class="section-sub">' + (pending.length
            ? 'They have asked to read Tracey\u2019s journey. Nobody sees the journal until you approve.'
            : '') + '</div>'
        + (pending.length ? pending.map(pendingRow).join('')
            : '<div class="empty">No one waiting.</div>')
        + '<div class="section-title">Registered friends</div>'
