<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Your people</title>
  <!-- Added to a home screen, this becomes the icon and the label.
       Without them iOS uses a screenshot of the page and the full title. -->
  <link rel="apple-touch-icon" href="/icon-180.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="apple-mobile-web-app-title" content="For Tracey" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#F7F5F0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="robots" content="noindex, nofollow" />
<style>
  :root{
    --bg:#F7F5F0; --card-bg:#FFF; --text:#2B2321; --text-muted:#6E6558; --border:#E4DFD3;
    --sage:#6B7F5E; --teal:#3D5A5B; --clay:#A85C32; --rose:#B5696A;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;
       -webkit-font-smoothing:antialiased}
  .app{max-width:640px;margin:0 auto;padding:26px 18px 64px}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:1.85rem;margin:0 0 6px;
     letter-spacing:-.01em}
  .sub{margin:0 0 24px;color:var(--text-muted);font-size:.93rem;line-height:1.55;max-width:46ch}
  .gate{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:20px}
  .gate p{color:var(--text-muted);font-size:.9rem;line-height:1.55;margin:0 0 14px}
  input{width:100%;font-family:inherit;font-size:16px;padding:11px 13px;
    border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text);
    margin-bottom:10px}
  .btn{font-family:inherit;font-size:.87rem;font-weight:600;border:none;border-radius:8px;
    padding:10px 17px;cursor:pointer;background:var(--text);color:#fff}
  .btn.small{font-size:.76rem;padding:6px 11px;border-radius:6px;
    background:var(--card-bg);border:1px solid var(--border);color:var(--text-muted)}
  .btn.small.on{background:var(--text);border-color:var(--text);color:#fff}
  .err{color:var(--rose);font-size:.85rem;margin:0 0 10px;min-height:1em}
  .status{color:var(--text-muted);font-size:.9rem;padding:20px 0}
  .anytime-chip{display:inline-block;font-size:.68rem;font-weight:700;
    letter-spacing:.05em;text-transform:uppercase;color:var(--teal);
    background:#EDF1F0;border-radius:100px;padding:2px 8px;margin-right:6px;
    vertical-align:middle}
  .reqform{background:var(--card-bg);border:1px solid var(--border);
    border-radius:11px;padding:15px;margin:0 0 20px}
  .reqform input,.reqform textarea{width:100%;font-family:inherit;font-size:16px;
    padding:10px 12px;border:1px solid var(--border);border-radius:8px;
    margin-bottom:8px;background:#fff;color:var(--text)}
  .reqform textarea{min-height:60px;resize:vertical}
  .reqform label{display:block;font-size:.78rem;font-weight:600;
    color:var(--text-muted);margin:2px 0 4px}
  .reqbar{display:flex;justify-content:space-between;align-items:center;gap:10px;
    background:var(--card-bg);border:1px solid var(--border);border-radius:9px;
    padding:11px 13px;margin:0 0 20px;font-size:.86rem;color:var(--text)}
  .reqbar button{font-size:.78rem;font-weight:600;padding:7px 13px;border-radius:7px;
    border:1px solid var(--sage);background:var(--sage);color:#fff;cursor:pointer;
    font-family:inherit;flex:0 0 auto}
  .warm{background:var(--card-bg);border:1px solid var(--sage);border-radius:11px;
    padding:15px 17px;margin:0 0 22px}
  .warm p{margin:0;font-size:.95rem;line-height:1.6;color:var(--text)}
  .section-title{font-family:'Fraunces',serif;font-size:1.2rem;font-weight:500;
    margin:26px 0 3px;letter-spacing:-.01em}
  .section-sub{color:var(--text-muted);font-size:.83rem;margin:0 0 12px;line-height:1.5}
  .wk{border-top:1px solid var(--border);margin-top:6px}
  .wk > summary{cursor:pointer;list-style:none;display:flex;align-items:center;
    gap:9px;padding:13px 2px;-webkit-tap-highlight-color:transparent}
  .wk > summary::-webkit-details-marker{display:none}
  .wk > summary h3{font-family:'Fraunces',serif;font-size:1.05rem;font-weight:500;
    margin:0;flex:1 1 auto;color:var(--text)}
  .wk > summary .n{flex:0 0 auto;font-size:.72rem;font-weight:600;
    color:var(--text-muted);background:#EFEDE6;border-radius:100px;padding:2px 9px}
  .wk > summary .n.gap{background:var(--clay);color:#fff}
  .wk > summary .mark{flex:0 0 auto;color:var(--text-muted);font-size:1.05rem;
    transition:transform .15s}
  .wk[open] > summary .mark{transform:rotate(90deg)}
  .postrow{border:1px solid var(--border);background:var(--card-bg);
    border-radius:10px;padding:13px;margin-bottom:9px}
  .postrow h4{margin:0 0 2px;font-size:.93rem;font-weight:600}
  .postrow .pmeta{color:var(--text-muted);font-size:.79rem;margin:0 0 9px}
  .postrow .excerpt{color:var(--text-muted);font-size:.84rem;line-height:1.5;
    margin:0 0 11px}
  .postbtns{display:flex;gap:6px;flex-wrap:wrap}
  .postbtns button{font-size:.75rem;font-weight:600;padding:6px 10px;
    border-radius:6px;border:1px solid var(--border);background:var(--card-bg);
    color:var(--text-muted);cursor:pointer;font-family:inherit}
  .postbtns button.on{background:var(--text);border-color:var(--text);color:#fff}
  .postbtns button.danger{color:var(--rose);border-color:var(--rose)}
  .pics{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 2px}
  .pics figure{margin:0;position:relative}
  .pics img{height:64px;width:64px;object-fit:cover;border-radius:8px;
    border:1px solid var(--border);display:block;background:#EFEDE6}
  .pics button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;
    border-radius:50%;border:1px solid var(--border);background:#fff;
    color:var(--rose);font-size:.8rem;line-height:1;cursor:pointer;
    padding:0;font-family:inherit}
  .addpic{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;
    font-weight:600;padding:6px 11px;border-radius:100px;
    border:1px dashed var(--border);background:transparent;
    color:var(--text-muted);cursor:pointer;font-family:inherit}
  .addpic input{display:none}
  .picnote{font-size:.74rem;color:var(--text-muted);margin:6px 2px 0}
  .day{font-size:.78rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;
    letter-spacing:.05em;margin:18px 0 7px}
  .item{background:var(--card-bg);border:1px solid var(--border);border-radius:10px;
    padding:12px 14px;margin-bottom:8px}
  .item h4{margin:0 0 2px;font-size:.93rem;font-weight:600}
  .item .meta{color:var(--text-muted);font-size:.81rem;line-height:1.5;margin:0}
  .item .who{color:var(--sage);font-weight:600}
  .item.open{border-style:dashed}
  .item details{margin:7px 0 0}
  .item summary{cursor:pointer;list-style:none;font-size:.77rem;font-weight:600;
    color:var(--teal);background:#EDF1F0;border:1px solid #D8E2E0;border-radius:100px;
    padding:4px 11px;display:inline-flex;align-items:center;gap:5px;
    -webkit-tap-highlight-color:transparent}
  .item summary::-webkit-details-marker{display:none}
  .item summary::after{content:'›';display:inline-block;transition:transform .15s;
    font-size:.95rem;line-height:1}
  .item details[open] summary::after{transform:rotate(90deg)}
  .item .note{color:var(--text-muted);font-size:.81rem;line-height:1.5;
    margin:5px 0 0;white-space:pre-wrap}
  .item.open .who{color:var(--text-muted);font-weight:400;font-style:italic}
  .person{display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:11px 0;border-top:1px solid var(--border)}
  .person .nm{font-size:.88rem;font-weight:600}
  .person .em{color:var(--text-muted);font-size:.78rem}
  .btns{display:flex;gap:6px;flex:0 0 auto}
  .empty{color:var(--text-muted);font-size:.87rem;padding:14px 0;line-height:1.5}
</style>
</head>
<body>
<div class="app">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">
    <h1 id="h1">Your people</h1>
    <a href="/" style="flex:0 0 auto;font-size:.78rem;font-weight:600;
       border:1px solid var(--border);background:var(--card-bg);color:var(--text-muted);
       border-radius:100px;padding:6px 13px;text-decoration:none;margin-top:6px">Signup page</a>
  </div>
  <p class="sub" id="sub"></p>
  <div id="content" class="status">Loading&hellip;</div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function () {
  var cfg = window.TRACEY_CONFIG || {};
  var content = document.getElementById('content');
  var sub = document.getElementById('sub');

  if (!cfg.SUPABASE_URL || cfg.SUPABASE_URL.indexOf('YOUR-PROJECT') !== -1) {
    content.textContent = 'config.js still has placeholder values.';
    return;
  }
  var db = supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);

  var pass = null, data = null, err = '';
  var showReq = false;
  var shutWeek = {};   // weeks she has folded away

  try { pass = sessionStorage.getItem('tracey_pass') || null; } catch (e) {}

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function fmtDay(iso){
    if (!iso) return 'Anytime';
    try {
      var d = new Date(iso + 'T12:00:00Z');
      var today = new Date(); today.setHours(12,0,0,0);
      var diff = Math.round((d - today) / 86400000);
      if (diff === 0) return 'Today';
      if (diff === 1) return 'Tomorrow';
      return d.toLocaleDateString(undefined,
        { weekday:'long', month:'long', day:'numeric', timeZone:'UTC' });
    } catch(e){ return iso; }
  }

  // ---------- the gate ----------
  function gate() {
    sub.textContent = '';
    content.className = '';
    content.innerHTML = '<div class="gate">'
      + '<p>Enter your passphrase to see who is helping this week. '
      + 'The same passphrase works from the Coordinator button on the signup page.</p>'
      + '<div class="err">' + esc(err) + '</div>'
      + '<input type="password" id="p" placeholder="Passphrase" autocomplete="current-password" />'
      + '<button class="btn" id="go">Open</button></div>';

    var input = document.getElementById('p');
    function submit() {
      var v = (input.value || '').trim();
      if (!v) return;
      pass = v;
      try { sessionStorage.setItem('tracey_pass', v); } catch (e) {}
      load();
    }
    document.getElementById('go').addEventListener('click', submit);
    input.addEventListener('keydown', function(e){ if (e.key === 'Enter') submit(); });
    input.focus();
  }

  // ---------- the view ----------
// Shrinks a photograph on the phone before it is sent.
  //
  // This is what makes adding one from the page work at all: a picture
  // straight from a camera is four or five megabytes, and every route
  // into this app has a limit somewhere below that. Drawn onto a canvas
  // at a sensible size it comes out around two hundred kilobytes, and
  // looks identical on a screen.
  //
  // No library. The browser has done this since roughly 2012.
  function shrinkPhoto(file) {
  return new Promise(function (resolve, reject) {
    if (!/^image\//.test(file.type)) {
      reject(new Error('That is not a photograph.'));
      return;
    }

    var reader = new FileReader();
    reader.onerror = function () { reject(new Error('Could not read that file.')); };
    reader.onload = function () {
      var img = new Image();
      img.onerror = function () {
        // HEIC from an iPhone sometimes cannot be decoded by the
        // browser. Choosing "Most Compatible" in Camera settings
        // fixes it, but saying so is more use than failing silently.
        reject(new Error('That kind of photo could not be read. '
          + 'Try taking a screenshot of it and sending that, or set '
          + 'Camera to Most Compatible in Settings.'));
      };
      img.onload = function () {
        // Long edge of 1600: sharp on any phone, and well under any
        // limit once compressed.
        var MAX = 1600;
        var w = img.width, h = img.height;
        if (w > MAX || h > MAX) {
          if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
          else { w = Math.round(w * MAX / h); h = MAX; }
        }

        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        var ctx = c.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, w, h);      // so a transparent PNG is not black
        ctx.drawImage(img, 0, 0, w, h);

        var url = c.toDataURL('image/jpeg', 0.82);
        var comma = url.indexOf(',');
        if (comma < 0) { reject(new Error('Could not prepare that photo.')); return; }

        resolve({ mime: 'image/jpeg', bytes: url.slice(comma + 1) });
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
  }

  function render() {
    content.className = '';

    var needs = data.needs || [];
    var covered = needs.filter(function(n){ return n.status === 'FILLED'; });
    var open = needs.filter(function(n){ return n.status === 'OPEN'; });

    // A sense of the whole, without counting anyone individually.
    var warm = '';
    if (data.helpers > 0) {
      warm = '<div class="warm"><p>'
        + data.helpers + (data.helpers === 1 ? ' friend has' : ' friends have')
        + ' stepped in so far, covering ' + data.covered_total
        + (data.covered_total === 1 ? ' thing' : ' things') + '.</p></div>';
    }

    // Grouped by day, so it reads like a week rather than a list.
    // Undated requests have no day to sit under, so they get their own
    // group at the top rather than falling into a bucket called "null".
    var byDay = {};
    needs.forEach(function(n){
      var key = n.date || 'anytime';
      (byDay[key] = byDay[key] || []).push(n);
    });
    var days = Object.keys(byDay).sort(function(a, b){
      if (a === 'anytime') return -1;
      if (b === 'anytime') return 1;
      return a < b ? -1 : 1;
    });

    // Her own writing, with the same three levels a coordinator has.
    // Hiding keeps a piece in case she changes her mind; deleting does
    // not, which is why it asks first.
    var posts = data.posts || [];

    function postRow(p) {
      var vis = p.visibility || 'approved';
      var pics = p.photos || [];
      var text = String(p.body || '').replace(/[#*>_`\-|]/g, ' ')
                   .replace(/\s+/g, ' ').trim();
      var excerpt = text.length > 140 ? text.slice(0, 140) + '\u2026' : text;

      function b(level, label) {
        return '<button data-act="setvis" data-id="' + p.id + '"'
          + ' data-vis="' + level + '"' + (vis === level ? ' class="on"' : '')
          + '>' + label + '</button>';
      }

      return '<div class="postrow">'
        + '<h4>' + esc(p.title) + '</h4>'
        + '<p class="pmeta">' + esc(fmtDay(String(p.published).slice(0, 10)))
        +   (vis === 'hidden' ? ' \u00b7 hidden from everyone'
            : vis === 'close' ? ' \u00b7 closer circle only'
            : ' \u00b7 everyone you have let in') + '</p>'
        + (excerpt ? '<p class="excerpt">' + esc(excerpt) + '</p>' : '')
        + (pics.length
            ? '<div class="pics">' + pics.map(function (ph) {
                // Her passphrase rather than an email: this page has no
                // registration behind it. Never cached anywhere shared.
                return '<figure><img alt="" src="/api/photo?id='
                  + encodeURIComponent(ph.id) + '&pass=' + encodeURIComponent(pass)
                  + '" /><button data-act="delpic" data-id="' + ph.id
                  + '" title="Remove">\u00d7</button></figure>';
              }).join('') + '</div>'
            : '')
        + '<div class="postbtns" style="margin-top:9px">'
        +   b('approved', 'Everyone') + b('close', 'Closer') + b('hidden', 'Hide')
        +   '<label class="addpic">Add a photo'
        +     '<input type="file" accept="image/*" data-post="' + p.id + '" />'
        +   '</label>'
        +   '<button class="danger" data-act="delpost" data-id="' + p.id + '">Delete</button>'
        + '</div>'
        + '<p class="picnote" id="picnote-' + p.id + '"></p>'
        + '</div>';
    }

    // Grouped into weeks, with this one open and the rest folded. Seeing
    // a month at once is not restful, and the question she is usually
    // asking is about the next few days.
    function weekStart(iso) {
      var d = new Date(iso + 'T12:00:00Z');
      d.setUTCDate(d.getUTCDate() - d.getUTCDay());   // back to Sunday
      return d.toISOString().slice(0, 10);
    }

    function weekLabel(wk, i) {
      if (wk === 'anytime') return 'Whenever suits';
      if (i === 0) return 'This week';
      if (i === 1) return 'Next week';
      var d = new Date(wk + 'T12:00:00Z');
      return 'Week of ' + d.toLocaleDateString(undefined,
        { month: 'long', day: 'numeric', timeZone: 'UTC' });
    }

    function dayBlock(d) {
      return '<div class="day">'
        + esc(d === 'anytime' ? 'Whenever suits' : fmtDay(d)) + '</div>'
        + byDay[d].map(item).join('');
    }

    function item(n) {
      var covered = n.status === 'FILLED';
      return '<div class="item' + (covered ? '' : ' open') + '">'
        + '<h4>' + esc(n.title) + '</h4>'
        + '<p class="meta">'
        +   (n.anytime
              ? '<span class="anytime-chip">Anytime</span>'
                + (n.date && n.start_time
                    ? esc(fmtDay(n.date)) + ', ' + esc(n.start_time)
                    : n.date ? 'by ' + esc(fmtDay(n.date))
                    : n.start_time ? esc(n.start_time)
                    : 'whenever suits')
              : esc(n.start_time)
                + (n.end_time ? '\u2013' + esc(n.end_time) : '')
                + (n.location ? ' \u00b7 ' + esc(n.location) : ''))
        +   '<br><span class="who">'
        +   (covered ? esc(n.volunteer_name) : 'Nobody yet')
        +   '</span></p>'
        + (!covered && n.other_half_covered
            ? '<p class="note" style="color:var(--clay);font-weight:600">'
              + 'The other half of this trip is covered</p>' : '')
        + (String(n.instructions || '').trim()
            ? '<details><summary>Details</summary>'
              + '<p class="note">' + esc(String(n.instructions).trim()) + '</p></details>'
            : '')
        + '</div>';
    }

    // Undated requests keep their own group, above the weeks.
    var byWeek = {};
    days.forEach(function(d){
      var k = d === 'anytime' ? 'anytime' : weekStart(d);
      (byWeek[k] = byWeek[k] || []).push(d);
    });
    var weeks = Object.keys(byWeek).sort(function(a, b){
      if (a === 'anytime') return -1;
      if (b === 'anytime') return 1;
      return a < b ? -1 : 1;
    });

    var dated = weeks.filter(function(w){ return w !== 'anytime'; });

    var schedule = weeks.length
      ? weeks.map(function(w){
          var i = dated.indexOf(w);
          var items = byWeek[w].reduce(function(acc, d){
            return acc.concat(byDay[d]); }, []);
          var uncovered = items.filter(function(n){ return n.status !== 'FILLED'; }).length;
          var isOpen = shutWeek[w] === undefined ? (w === 'anytime' || i === 0)
                                                 : !shutWeek[w];

          return '<details class="wk"' + (isOpen ? ' open' : '')
            + ' data-week="' + esc(w) + '">'
            + '<summary><h3>' + esc(weekLabel(w, i)) + '</h3>'
            +   '<span class="n' + (uncovered ? ' gap' : '') + '">'
            +     (uncovered ? uncovered + ' open' : 'all covered') + '</span>'
            +   '<span class="mark">\u203a</span></summary>'
            + '<div>' + byWeek[w].map(dayBlock).join('') + '</div>'
            + '</details>';
        }).join('')
      : '<div class="empty">Nothing on the calendar just now.</div>';

    // ---------- journal readers ----------
    var pending = data.pending || [];
    var readers = data.readers || [];

    var pendingHtml = pending.length
      ? pending.map(function(p){
          return '<div class="person">'
            + '<div><div class="nm">' + esc(p.name) + '</div>'
            +   '<div class="em">' + esc(p.email) + '</div></div>'
            + '<div class="btns">'
            +   '<button class="btn small" data-act="set" data-email="' + esc(p.email) + '" data-level="approved">Let them read</button>'
            +   '<button class="btn small" data-act="set" data-email="' + esc(p.email) + '" data-level="none">Not now</button>'
            + '</div></div>';
        }).join('')
      : '<div class="empty">Nobody waiting.</div>';

    var readersHtml = readers.length
      ? readers.map(function(p){
          return '<div class="person">'
            + '<div><div class="nm">' + esc(p.name) + '</div>'
            +   '<div class="em">' + (p.access === 'close' ? 'closer circle' : 'reads your updates') + '</div></div>'
            + '<div class="btns">'
            +   '<button class="btn small' + (p.access === 'approved' ? ' on' : '') + '" data-act="set" data-email="' + esc(p.email) + '" data-level="approved">Updates</button>'
            +   '<button class="btn small' + (p.access === 'close' ? ' on' : '') + '" data-act="set" data-email="' + esc(p.email) + '" data-level="close">Closer</button>'
            +   '<button class="btn small" data-act="set" data-email="' + esc(p.email) + '" data-level="none">Stop</button>'
            +   '<button class="btn small" data-act="resend" data-email="' + esc(p.email) + '"'
            +     ' data-name="' + esc(p.name) + '">Email link</button>'
            + '</div></div>';
        }).join('')
      : '<div class="empty">Nobody reading your updates yet.</div>';

    // Something she needs that is not an appointment. She should not have
    // to ask anyone to put a pint of milk on a list.
    var reqBlock = showReq
      ? '<div class="reqform">'
        + '<label>What would help</label>'
        + '<input type="text" id="rq-title" placeholder="Milk, bread and something for dinner" />'
        + '<label>Anything worth knowing</label>'
        + '<textarea id="rq-note" placeholder="The oat milk in the blue carton"></textarea>'
        + '<label>Needed by (leave blank if it can wait)</label>'
        + '<input type="date" id="rq-by" />'
        + '<label>When would suit (optional)</label>'
        + '<input type="text" id="rq-when" placeholder="Afternoon, or after I am back from rehab" />'
        + '<div class="err" id="rq-err"></div>'
        + '<div class="btns">'
        +   '<button class="btn" data-act="postreq">Put it on the list</button>'
        +   '<button class="btn small" data-act="toggreq">Cancel</button>'
        + '</div></div>'
      : '<div class="reqbar"><span>Need something that is not an appointment?</span>'
        + '<button data-act="toggreq">Ask for something</button></div>';

    sub.textContent = 'What is coming up, and who is covering it.';
    content.innerHTML = reqBlock + warm
      + '<div class="section-title">The week ahead</div>'
      + '<div class="section-sub">' + (open.length
          ? open.length + (open.length === 1 ? ' thing is' : ' things are') + ' still open. Nobody expects you to sort that out.'
          : 'Everything is covered.') + '</div>'
      + schedule
      + (posts.length
          ? '<div class="section-title">What you have written</div>'
            + '<div class="section-sub">Change who sees a piece, or take it '
            + 'down. Nobody is told a post exists that they cannot see.</div>'
            + posts.map(postRow).join('')
          : '')
      + '<div class="section-title">Waiting to read your updates</div>'
      + '<div class="section-sub">Yours to decide. Nobody is told which level they are on.</div>'
      + pendingHtml
      + '<div class="section-title">Reading your updates</div>'
      + readersHtml;
  }

  // ---------- actions ----------
  // Tells a friend they can read, with the link. Without it they would
  // only find out by opening the page and noticing the button changed.
  async function tellThem(email, name, again) {
    try {
      var res = await fetch('/api/notify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'access-granted', email: email, name: name, again: again === true
        })
      });
      return res.ok;
    } catch (e) { return false; }
  }

  document.addEventListener('click', async function(e){
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');

    if (act === 'setvis') {
      el.disabled = true;
      var vr = await db.rpc('set_post_visibility', {
        p_pass: pass, p_id: el.getAttribute('data-id'),
        p_visibility: el.getAttribute('data-vis')
      });
      el.disabled = false;
      if (vr.error || !vr.data || vr.data.ok !== true) {
        window.alert('Could not change that just now.'); return;
      }
      await load();
      return;
    }

    if (act === 'delpic') {
      if (!window.confirm('Remove this photo?')) return;
      var pr = await db.rpc('remove_photo', {
        p_pass: pass, p_id: el.getAttribute('data-id')
      });
      if (pr.error || !pr.data || pr.data.ok !== true) {
        window.alert('Could not remove that just now.'); return;
      }
      await load();
      return;
    }

    if (act === 'delpost') {
      if (!window.confirm('Delete this for good?\n\nHiding it keeps it in '
            + 'case you change your mind.')) return;
      var dr = await db.rpc('delete_post', {
        p_pass: pass, p_id: el.getAttribute('data-id')
      });
      if (dr.error || !dr.data || dr.data.ok !== true) {
        window.alert('Could not delete that just now.'); return;
      }
      await load();
      return;
    }

    if (act === 'toggreq') {
      showReq = !showReq;
      render();
      return;
    }

    if (act === 'postreq') {
      var t = (document.getElementById('rq-title').value || '').trim();
      var note = (document.getElementById('rq-note').value || '').trim();
      var by = (document.getElementById('rq-by').value || '').trim();
      var slot = document.getElementById('rq-err');
      slot.textContent = '';

      if (t.length < 3) {
        slot.textContent = 'A few words about what would help.';
        return;
      }

      el.disabled = true;
      el.textContent = 'Posting…';
      var qr = await db.rpc('add_request', {
        p_title: t, p_pass: pass, p_category: 'errands',
        p_by_when: by || null, p_instructions: note,
        p_window: (document.getElementById('rq-when').value || '').trim()
      });
      el.disabled = false;
      el.textContent = 'Put it on the list';

      if (qr.error || !qr.data || qr.data.ok !== true) {
        slot.textContent = 'Could not post that just now. Please try again.';
        return;
      }
      showReq = false;
      await load();
      return;
    }

    if (act === 'resend') {
      el.disabled = true;
      var was = el.textContent;
      el.textContent = 'Sending…';
      var ok = await tellThem(el.getAttribute('data-email'),
                              el.getAttribute('data-name') || '', true);
      el.disabled = false;
      el.textContent = ok ? 'Sent' : 'Try again';
      setTimeout(function(){ el.textContent = was; }, 2500);
      return;
    }

    if (act !== 'set') return;

    var em = el.getAttribute('data-email');
    var lvl = el.getAttribute('data-level');

    // Whether they were already reading, so moving someone between
    // levels does not email them all over again.
    var all = (data.pending || []).concat(data.readers || []);
    var before = all.filter(function(p){ return p.email === em; })[0];
    var wasReading = before && (before.access === 'approved' || before.access === 'close');

    el.disabled = true;
    var r = await db.rpc('tracey_set_access', {
      p_pass: pass, p_email: em, p_level: lvl
    });
    el.disabled = false;
    if (r.error || !r.data || r.data.ok !== true) {
      window.alert('Could not change that just now. Please try again.');
      return;
    }

    if (!wasReading && (lvl === 'approved' || lvl === 'close')) {
      tellThem(em, before ? before.name : '', false);
    }
    await load();
  });

  async function load() {
    if (!pass) { gate(); return; }
    content.className = 'status';
    content.textContent = 'Loading…';

    var r = await db.rpc('tracey_view', { p_pass: pass });
    if (r.error) {
      pass = null;
      try { sessionStorage.removeItem('tracey_pass'); } catch (e) {}
      err = 'That passphrase did not work.';
      gate();
      return;
    }
    err = '';
    data = r.data;
    render();
  }

  // Reopened from a home screen icon, iOS may show this page exactly as
  // it was left rather than loading it again. Fetch afresh when it comes
  // back after a while.
  var lastLoaded = 0;
  function refreshIfStale() {
    if (document.visibilityState !== 'visible') return;
    if (Date.now() - lastLoaded < 45000) return;
    lastLoaded = Date.now();
    load();
  }
  // Between them these cover every way a page comes back:
  //   visibilitychange  app switcher, tab switch, screen unlock (iOS + Android)
  //   pageshow          restored from cache rather than loaded
  //   focus             window refocused on a laptop
  //   resume            older Android webviews
  // Which weeks she has folded away, kept for the visit.
  // Choosing a photo: shrink it here, then send it. The shrinking is
  // what keeps this under every limit in the chain.
  document.addEventListener('change', async function (e) {
    var input = e.target;
    if (!input || input.type !== 'file' || !input.getAttribute('data-post')) return;

    var postId = input.getAttribute('data-post');
    var file = input.files && input.files[0];
    var note = document.getElementById('picnote-' + postId);
    input.value = '';                      // so the same file can be picked again
    if (!file) return;

    if (note) note.textContent = 'Preparing\u2026';

    try {
      var small = await shrinkPhoto(file);
      if (note) note.textContent = 'Adding\u2026';

      var r = await db.rpc('add_photo_by_pass', {
        p_pass: pass, p_post_id: postId,
        p_mime: small.mime, p_bytes: small.bytes,
        p_caption: ''
      });

      if (r.error || !r.data || r.data.ok !== true) {
        if (note) note.textContent = 'Could not add that photo.';
        return;
      }
      if (note) note.textContent = '';
      await load();
    } catch (err) {
      if (note) note.textContent = err.message || 'Could not add that photo.';
    }
  });

  document.addEventListener('toggle', function (e) {
    var d = e.target;
    if (!d || !d.classList || !d.classList.contains('wk')) return;
    var k = d.getAttribute('data-week');
    if (k) shutWeek[k] = !d.open;
  }, true);

  document.addEventListener('visibilitychange', refreshIfStale);
  window.addEventListener('pageshow', function (e) {
    if (e.persisted) { lastLoaded = 0; refreshIfStale(); }
  });
  window.addEventListener('focus', refreshIfStale);
  document.addEventListener('resume', refreshIfStale);
  // A tab left open and watched fires none of the events above.
  setInterval(function () {
    if (document.visibilityState === 'visible') refreshIfStale();
  }, 180000);

  lastLoaded = Date.now();
  load();

  // ---------- staying current ----------
  //
  // A page open since before a deploy keeps running old code, and no
  // deploy can reach into it. So it asks about itself: a HEAD request
  // to its own address returns an ETag that changes whenever this file
  // changes. Different from the one it started with means the page in
  // front of you is out of date.
  //
  // Asking about this page rather than about the deploy is the right
  // question: a change to a function elsewhere does not require the
  // person reading this to have anything reloaded.
  var myTag = null;
  var needsReload = false;

  async function checkBuild() {
    try {
      var res = await fetch(window.location.pathname, {
        method: 'HEAD', cache: 'no-store'
      });
      if (!res.ok) return;
      var tag = res.headers.get('etag') || res.headers.get('last-modified');
      if (!tag) return;                    // nothing to compare: never fires

      if (myTag === null) { myTag = tag; return; }
      if (tag !== myTag) needsReload = true;
    } catch (e) { /* offline: try again later */ }
  }

  function reloadIfDue() {
    if (!needsReload) return;
    if (document.visibilityState !== 'visible') return;
    // Never while a question is on screen or something is being typed.
    if (document.querySelector('.ask-bg')) return;
    var el = document.activeElement;
    if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA')) return;
    window.location.reload();
  }

  checkBuild();
  setInterval(function () {
    if (document.visibilityState !== 'visible') return;
    checkBuild().then(reloadIfDue);
  }, 180000);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') checkBuild().then(reloadIfDue);
  });

})();
</script>
</body>
</html>
